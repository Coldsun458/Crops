<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KisanVyapar Mandi Desk | राष्ट्रीय कृषि थोक व्यापार मंच</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace'],
            mandi: ['"Rozha One"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #0c1712; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #234633; border-radius: 4px; }
    .grain-pattern {
      background-color: #061e14;
      background-image: radial-gradient(#144833 0.8px, transparent 0.8px), radial-gradient(#144833 0.8px, #061e14 0.8px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
    }
  </style>
</head>
<body class="grain-pattern text-stone-100 antialiased font-sans pb-28 md:pb-12 min-h-screen selection:bg-amber-500 selection:text-black">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const CROP_OPTIONS = [
      { id: "Wheat", hindi: "गेहूं (Sharbati/Lokwan)", msp: 2425.0, icon: "🌾" },
      { id: "Rice", hindi: "चावल (1121 Steam Basmati)", msp: 2320.0, icon: "🍚" },
      { id: "Mustard", hindi: "सरसों (Mustard 42% Oil)", msp: 5650.0, icon: "🌻" },
      { id: "Maize", hindi: "मक्का (Yellow Corn)", msp: 2225.0, icon: "🌽" },
      { id: "Gram", hindi: "चना (Desi Chana)", msp: 5440.0, icon: "🫘" }
    ];

    const CITY_OPTIONS = ["Jalandhar", "Delhi", "Chandigarh", "Jaipur", "Mumbai"];

    const BAGGING_LABELS = {
      "50KG_JUTE_GUNNY": "50 kg नई जूट बोरी (B-Twill Gunny +₹65/qtl)",
      "50KG_PP_BAG": "50 kg PP प्लास्टिक बैग (+₹28/qtl)",
      "BULK_LOOSE_TIPPER": "खुला लोडिंग (Loose Tipper ₹0/qtl)"
    };

    const DEFAULT_ACCOUNTS = [
      { email: "buyer@mill.com", id: "USR-BUYER-01", name: "Aryan Foods & Flour Mills Pvt. Ltd.", role: "BUYER", city: "Jalandhar", phone: "+91 98140 22341", gstin: "03AAACA4582K1ZD" },
      { email: "delhi.miller@agro.com", id: "USR-BUYER-02", name: "Delhi Agro Processing Corp Pvt. Ltd.", role: "BUYER", city: "Delhi", phone: "+91 98101 44589", gstin: "07AABCD8821L1ZM" },
      { email: "manager@doaba-fpo.org", id: "USR-FPO-01", name: "Doaba Farmer Producer Company Ltd.", role: "FPO", city: "Khanna", phone: "+91 98722 33412", gstin: "03AAACD9182P1ZQ" },
      { email: "karnal.fpo@haryana.org", id: "USR-FPO-02", name: "Taraori Basmati Growers Farmer Producer Co. Ltd.", role: "FPO", city: "Karnal", phone: "+91 94160 55823", gstin: "06AABCK7712M1ZF" }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(DEFAULT_ACCOUNTS[0]);
      const [token, setToken] = useState(localStorage.getItem("agri_jwt") || "");
      const [accounts, setAccounts] = useState(DEFAULT_ACCOUNTS);
      const [tab, setTab] = useState("calculator"); // calculator, bidding, escrow, passbook, compliance
      const [notification, setNotification] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);

      const [commodity, setCommodity] = useState("Wheat");
      const [city, setCity] = useState("Delhi");
      const [quantityQtl, setQuantityQtl] = useState(200);
      const [baggingType, setBaggingType] = useState("50KG_JUTE_GUNNY");
      const [insuranceOpted, setInsuranceOpted] = useState(true);

      const [recommendationData, setRecommendationData] = useState(null);
      const [loadingRecs, setLoadingRecs] = useState(false);

      const [bids, setBids] = useState([]);
      const [orders, setOrders] = useState([]);
      const [samples, setSamples] = useState([]);
      const [passbook, setPassbook] = useState(null);
      const [selectedPassbookLot, setSelectedPassbookLot] = useState("FPO-LOT-101");

      const [showNewBidModal, setShowNewBidModal] = useState(false);
      const [showCounterModal, setShowCounterModal] = useState(null);
      const [showBuyModal, setShowBuyModal] = useState(null);
      const [showSampleModal, setShowSampleModal] = useState(null);
      const [showAssayingModal, setShowAssayingModal] = useState(null);
      const [showEwayModal, setShowEwayModal] = useState(null);

      const [bidForm, setBidForm] = useState({ commodity: "Wheat", target_qty_qtl: 200, target_bid_price_per_qtl: 2470, delivery_city: "Delhi" });
      const [counterPrice, setCounterPrice] = useState(2520);
      const [counterNotes, setCounterNotes] = useState("100% शुद्ध ग्रेड-A माल, तुरंत रवानगी तैयार");
      const [deliveryAddress, setDeliveryAddress] = useState("आर्यन फूड्स एंड फ्लोर मिल्स प्रा. लि., प्लॉट नं. 48-52, फोकल प्वाइंट फेज-V, जी.टी. रोड बाईपास, जालंधर, पंजाब - 144050");
      const [gstin, setGstin] = useState("03AAACA4582K1ZD");

      const isBuyer = currentUser?.role === "BUYER";
      const isFPO = currentUser?.role === "FPO";

      const showToast = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4500);
      };

      const apiFetch = async (url, options = {}) => {
        const headers = { "Content-Type": "application/json", ...options.headers };
        const activeToken = token || localStorage.getItem("agri_jwt");
        if (activeToken) headers["Authorization"] = `Bearer ${activeToken}`;
        try {
          const res = await fetch(url, { ...options, headers });
          if (res.status === 401 || res.status === 403) {
            const err = await res.json().catch(() => ({ detail: "पहुंच अस्वीकृत" }));
            showToast(`अधिकार सूचना: ${err.detail}`);
            return null;
          }
          return res;
        } catch (err) {
          showToast("सर्वर कनेक्शन त्रुटि");
          return null;
        }
      };

      const loginPersona = async (email) => {
        try {
          const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
          });
          if (res.ok) {
            const data = await res.json();
            const jwt = data.token || data.access_token;
            setToken(jwt);
            localStorage.setItem("agri_jwt", jwt);
            setCurrentUser(data.user);
            setShowLoginModal(false);
            const portalName = data.user.role === "BUYER" ? "🌾 खरीदार पोर्टल (Buyer Desk)" : "🚜 FPO / विक्रेता पोर्टल (Seller Desk)";
            showToast(`लॉगिन सफल: ${portalName} • ${data.user.name}`);
            refreshTradingData();
          } else {
            const fallbackUser = (accounts.length ? accounts : DEFAULT_ACCOUNTS).find(a => a.email === email) || DEFAULT_ACCOUNTS[0];
            setCurrentUser(fallbackUser);
            setShowLoginModal(false);
            showToast(`सक्रिय: ${fallbackUser.name} (${fallbackUser.role})`);
          }
        } catch (e) {
          const fallbackUser = (accounts.length ? accounts : DEFAULT_ACCOUNTS).find(a => a.email === email) || DEFAULT_ACCOUNTS[0];
          setCurrentUser(fallbackUser);
          setShowLoginModal(false);
          showToast(`सक्रिय (ऑफलाइन): ${fallbackUser.name} (${fallbackUser.role})`);
        }
      };

      const fetchMe = async () => {
        const res = await apiFetch("/api/v1/auth/me");
        if (res && res.ok) {
          const data = await res.json();
          setCurrentUser(data.user);
        } else {
          loginPersona("buyer@mill.com");
        }
      };

      useEffect(() => {
        fetch("/api/v1/auth/accounts")
          .then(r => r.json())
          .then(data => {
            if (Array.isArray(data) && data.length > 0) {
              setAccounts(data);
            }
            if (!token) {
              loginPersona("buyer@mill.com");
            } else {
              fetchMe();
            }
          })
          .catch(() => {
            if (!token) loginPersona("buyer@mill.com");
          });
      }, []);

      const fetchRecommendations = async () => {
        setLoadingRecs(true);
        try {
          const res = await fetch("/api/v1/recommendations", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              commodity,
              buyer_city: city,
              quantity_qtl: Number(quantityQtl) || 200
            })
          });
          if (res.ok) {
            setRecommendationData(await res.json());
          }
        } catch (e) {
          console.error(e);
        } finally {
          setLoadingRecs(false);
        }
      };

      useEffect(() => {
        fetchRecommendations();
      }, [commodity, city, quantityQtl]);

      const refreshTradingData = async () => {
        try {
          const [bidsRes, ordersRes, samplesRes] = await Promise.all([
            fetch("/api/v1/bids/live"),
            fetch("/api/v1/orders/all"),
            fetch("/api/v1/commercial/samples")
          ]);
          if (bidsRes.ok) setBids(await bidsRes.json());
          if (ordersRes.ok) setOrders(await ordersRes.json());
          if (samplesRes.ok) setSamples(await samplesRes.json());
        } catch (e) {}
      };

      useEffect(() => {
        refreshTradingData();
        const iv = setInterval(refreshTradingData, 8000);
        return () => clearInterval(iv);
      }, []);

      useEffect(() => {
        if (selectedPassbookLot) {
          fetch(`/api/v1/fpo/farmer-passbook/${selectedPassbookLot}`)
            .then(r => r.ok ? r.json() : null)
            .then(d => { if (d) setPassbook(d); })
            .catch(() => {});
        }
      }, [selectedPassbookLot]);

      const handleCreateBid = async (e) => {
        e.preventDefault();
        const res = await apiFetch("/api/v1/bids/create", { method: "POST", body: JSON.stringify(bidForm) });
        if (res && res.ok) {
          const d = await res.json();
          showToast(d.message || "बोली / प्रस्ताव दर्ज किया गया!");
          setShowNewBidModal(false);
          refreshTradingData();
        }
      };

      const handleAcceptBid = async (bidId) => {
        const res = await apiFetch(`/api/v1/bids/${bidId}/accept`, { method: "POST" });
        if (res && res.ok) {
          const d = await res.json();
          showToast(`सौदा पक्का! ऑर्डर आईडी: ${d.order?.order_id || 'तैयार'}`);
          refreshTradingData();
          setTab("escrow");
        }
      };

      const handleCounterBid = async (e) => {
        e.preventDefault();
        if (!showCounterModal) return;
        const res = await apiFetch(`/api/v1/bids/${showCounterModal.bid_id}/counter`, {
          method: "POST",
          body: JSON.stringify({ counter_price_per_qtl: Number(counterPrice), counter_notes: counterNotes })
        });
        if (res && res.ok) {
          showToast("पलट भाव भेजा गया!");
          setShowCounterModal(null);
          refreshTradingData();
        }
      };

      const handleAcceptCounter = async (bidId) => {
        const res = await apiFetch(`/api/v1/bids/${bidId}/counter-accept`, { method: "POST" });
        if (res && res.ok) {
          const d = await res.json();
          showToast(`पलट भाव स्वीकार! ऑर्डर तैयार: ${d.order_id}`);
          refreshTradingData();
          setTab("escrow");
        }
      };

      const handleExecuteBuy = async (lot) => {
        const res = await apiFetch("/api/v1/orders/buy", {
          method: "POST",
          body: JSON.stringify({
            lot_id: lot.id,
            quantity_qtl: Number(quantityQtl) || 200,
            delivery_address: deliveryAddress,
            gstin: gstin,
            buyer_city: city,
            bagging_type: baggingType,
            transit_insurance: insuranceOpted
          })
        });
        if (res && res.ok) {
          const d = await res.json();
          showToast(`सौदा पक्का! ई-वे बिल: ${d.eway_bill_no}`);
          setShowBuyModal(null);
          refreshTradingData();
          setTab("escrow");
        }
      };

      const handleRequestSample = async (lot) => {
        const res = await apiFetch("/api/v1/commercial/request-sample", {
          method: "POST",
          body: JSON.stringify({ lot_id: lot.id, delivery_address: deliveryAddress })
        });
        if (res && res.ok) {
          const d = await res.json();
          showToast(`1 किग्रा सीलबंद नमूना रवाना! कूरियर: ${d.sample_record.courier_tracking_no}`);
          setShowSampleModal(null);
          refreshTradingData();
        }
      };

      const handleDispatchOrder = async (orderId) => {
        const res = await apiFetch(`/api/v1/orders/${orderId}/dispatch`, { method: "POST" });
        if (res && res.ok) {
          const d = await res.json();
          showToast(`गाड़ी रवाना! 70% अमानत FPO को जारी (₹${d.released_dispatch_70?.toLocaleString('en-IN')})`);
          refreshTradingData();
        }
      };

      const handleDeliverOrder = async (orderId) => {
        const res = await apiFetch(`/api/v1/orders/${orderId}/deliver`, { method: "POST" });
        if (res && res.ok) {
          showToast(`माल प्राप्ति सत्यापित! अंतिम 10% अमानत जारी (सौदा पूर्ण)`);
          refreshTradingData();
        }
      };

      const activeBestPick = recommendationData?.best_pick;
      const allListings = recommendationData?.all_listings || [];

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Mandi Flash Header */}
          <header className="bg-[#052418] border-b border-[#1b5e3f] sticky top-0 z-40 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
              
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-lg bg-amber-500 flex items-center justify-center text-slate-950 font-bold text-2xl shadow-lg border-2 border-amber-300">
                  🌾
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="text-xl sm:text-2xl font-black tracking-tight text-amber-400 font-mandi">
                      किसान व्यापार मंडी डेस्क
                    </h1>
                    <span className="hidden sm:inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-900/80 text-emerald-300 border border-emerald-600">
                      LIVE MANDI TRADING
                    </span>
                  </div>
                  <p className="text-xs text-stone-300 font-medium">
                    National B2B Grain Wholesaler Desk • राष्ट्रीय थोक अनाज मंडी मंच
                  </p>
                </div>
              </div>

              {/* TWO DISTINCT PORTALS: DIRECT 1-CLICK TOGGLE & PERSONA BADGE */}
              <div className="flex flex-wrap items-center gap-2 sm:gap-3">
                {/* 1-Click Segmented Toggle Switcher */}
                <div className="flex items-center bg-[#02130c] p-1 rounded-xl border-2 border-emerald-600/80 shadow-lg">
                  <button
                    type="button"
                    onClick={() => loginPersona("buyer@mill.com")}
                    className={`px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-black flex items-center space-x-1.5 transition-all duration-150 cursor-pointer ${
                      isBuyer
                        ? "bg-amber-400 text-slate-950 shadow-md ring-2 ring-amber-300"
                        : "text-stone-300 hover:text-white hover:bg-[#093220]"
                    }`}
                    title="खरीदार पोर्टल में बदलें (Switch to Buyer Desk)"
                  >
                    <span>🌾</span>
                    <span>खरीदार (Buyer)</span>
                    {isBuyer && <span className="ml-1 text-[9px] bg-slate-950 text-amber-300 px-1.5 py-0.5 rounded-full font-black">सक्रिय</span>}
                  </button>

                  <button
                    type="button"
                    onClick={() => loginPersona("manager@doaba-fpo.org")}
                    className={`px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-black flex items-center space-x-1.5 transition-all duration-150 cursor-pointer ${
                      isFPO
                        ? "bg-emerald-500 text-slate-950 shadow-md ring-2 ring-emerald-300"
                        : "text-stone-300 hover:text-white hover:bg-[#093220]"
                    }`}
                    title="विक्रेता / FPO पोर्टल में बदलें (Switch to Seller Desk)"
                  >
                    <span>🚜</span>
                    <span>विक्रेता / FPO (Seller)</span>
                    {isFPO && <span className="ml-1 text-[9px] bg-slate-950 text-emerald-300 px-1.5 py-0.5 rounded-full font-black">सक्रिय</span>}
                  </button>
                </div>

                {/* Current Active Persona & Other Accounts Modal */}
                <button
                  type="button"
                  onClick={() => setShowLoginModal(true)}
                  className={`flex items-center space-x-2 px-3 py-1.5 rounded-lg border shadow text-left cursor-pointer hover:opacity-95 transition ${
                    isBuyer ? 'bg-amber-950/80 border-amber-500 text-amber-300' :
                    isFPO ? 'bg-emerald-950/80 border-emerald-500 text-emerald-300' :
                    'bg-stone-900 border-stone-600 text-stone-300'
                  }`}
                  title="अन्य खाता चुनें (Click to switch accounts)"
                >
                  <span className="text-base">{isBuyer ? '🌾' : '🚜'}</span>
                  <div>
                    <div className="text-[10px] font-bold uppercase tracking-wider opacity-80 flex items-center space-x-1">
                      <span>{isBuyer ? 'खरीदार मिलर' : 'FPO समिति'}</span>
                      <span className="text-[9px] underline text-stone-300 ml-1">▼ अन्य खाते</span>
                    </div>
                    <div className="text-xs font-black truncate max-w-[130px] sm:max-w-[170px]">
                      {currentUser?.name || 'अतिथि'}
                    </div>
                  </div>
                </button>
              </div>
            </div>

            {/* Live Ticker Bar */}
            <div className="bg-[#03170f] border-t border-[#12422c] py-1.5 px-4 overflow-x-auto text-[11px] font-mono text-stone-300 whitespace-nowrap custom-scroll flex items-center justify-between">
              <div className="flex items-center space-x-6">
                <span className="text-amber-400 font-bold flex items-center">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping mr-1.5"></span>
                  मंडी हाजिर भाव:
                </span>
                <span>🌾 गेहूं खन्ना: <b className="text-white">₹2,580</b> <span className="text-emerald-400">(+₹155 vs MSP)</span></span>
                <span>🌾 गेहूं करनाल: <b className="text-white">₹2,520</b></span>
                <span>🌾 गेहूं इंदौर: <b className="text-white">₹2,490</b></span>
                <span>🍚 बासमती 1121: <b className="text-white">₹4,100</b></span>
                <span>🌻 सरसों कोटा: <b className="text-white">₹5,620</b></span>
                <span>🌽 मक्का छिंदवाड़ा: <b className="text-white">₹2,240</b></span>
              </div>
              <div className="hidden lg:flex items-center space-x-4 text-stone-400">
                <span>🔒 3-चरणीय सुरक्षित अमानत (20%-70%-10%)</span>
                <span>📜 CGST E-Way Bill मान्य</span>
                <span>TCS: <b>0.1%</b></span>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-7xl mx-auto px-4 flex space-x-1 sm:space-x-3 overflow-x-auto custom-scroll pt-2">
              {[
                { id: "calculator", label: "मंडी भाव व लागत (Landed Bhao)", icon: "🌾" },
                { id: "bidding", label: "बोली व सौदा कक्ष (Live Bidding)", icon: "⚖️", count: bids.length },
                { id: "escrow", label: "व्यापार सौदे व भुगतान (Orders & Escrow)", icon: "📋", count: orders.length },
                { id: "passbook", label: "किसान बही खाता (Farmer Passbook)", icon: "👨‍🌾" },
                { id: "compliance", label: "सरकारी दस्तावेज़ (M-Form & EWB)", icon: "📜" }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`flex items-center space-x-1.5 px-3.5 py-2.5 text-xs sm:text-sm font-bold rounded-t-lg transition border-t-2 border-x whitespace-nowrap ${
                    tab === t.id
                      ? "bg-[#0b3323] text-amber-300 border-amber-400 border-b-0 shadow-lg"
                      : "bg-[#052015] text-stone-400 border-transparent hover:text-stone-200 hover:bg-[#082a1d]"
                  }`}
                >
                  <span>{t.icon}</span>
                  <span>{t.label}</span>
                  {t.count !== undefined && t.count > 0 && (
                    <span className="ml-1.5 px-1.5 py-0.2 rounded-full text-[10px] bg-amber-500 text-black font-black">
                      {t.count}
                    </span>
                  )}
                </button>
              ))}
            </div>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className="fixed top-20 right-4 z-50 max-w-md bg-amber-400 text-slate-950 font-bold px-4 py-3 rounded-lg shadow-2xl border-2 border-amber-200 flex items-center space-x-2 animate-bounce">
              <span className="text-xl">📢</span>
              <span className="text-xs sm:text-sm">{notification}</span>

                  {/* Seller / FPO Portal Card */}
                  <div className={`rounded-xl border-2 p-4 space-y-3 flex flex-col justify-between transition ${
                    isFPO ? 'bg-[#062419] border-emerald-400 ring-2 ring-emerald-400/40' : 'bg-[#051c13] border-emerald-500/60'
                  }`}>
                    <div>
                      <div className="flex items-center space-x-2 text-emerald-400 font-bold text-sm">
                        <span className="text-2xl">🚜</span>
                        <span>विक्रेता / FPO पोर्टल (SELLER DESK)</span>
                        {isFPO && <span className="ml-auto text-[10px] bg-emerald-400 text-slate-950 font-black px-2 py-0.5 rounded">सक्रिय</span>}
                      </div>
                      <p className="text-[11px] text-stone-400 mt-1">
                        किसान उत्पादक संगठन (FPOs) व आढ़तियों के लिए: बिक्री बोली / प्रस्ताव लगाएं, खरीदार बोलियां स्वीकारें व किसान खाता देखें।
                      </p>
                    </div>

                    <div className="space-y-2 pt-2 border-t border-[#164d34]">
                      <div className="text-[11px] text-stone-300 font-semibold">उपलब्ध विक्रेता FPO खाते (Click to Switch):</div>
                      {(accounts.length ? accounts : DEFAULT_ACCOUNTS).filter(a => a.role === "FPO").map(f => (
                        <button
                          key={f.email}
                          type="button"
                          onClick={() => loginPersona(f.email)}
                          className={`w-full text-left p-2.5 rounded text-xs font-bold border transition flex items-center justify-between cursor-pointer ${
                            currentUser?.email === f.email
                              ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200'
                              : 'bg-[#0b3323] hover:bg-[#124b34] text-stone-200 border-emerald-700/60'
                          }`}
                        >
                          <div>
                            <div className="flex items-center space-x-1.5">
                              <span className="font-sans">{f.name}</span>
                              {currentUser?.email === f.email && <span className="text-[9px] bg-emerald-400 text-slate-950 font-black px-1 rounded">सक्रिय</span>}
                            </div>
                            <div className="text-[10px] text-stone-400 font-normal font-sans">{f.city} मंडी • {f.phone}</div>
                          </div>
                          <span className="text-emerald-400 text-xs font-bold">{currentUser?.email === f.email ? '✓ चयनित' : 'लॉगिन →'}</span>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="pt-2 text-center text-xs text-stone-300">
                  वर्तमान सक्रिय खाता: <b className="text-amber-300">{currentUser?.name}</b> <span className="text-stone-400">({currentUser?.role === 'BUYER' ? 'खरीदार मिलर' : 'FPO समिति'})</span>
                </div>
              </div>
            </div>
          )}

          {/* BUY MODAL */}
          {showBuyModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#092c1d] rounded-2xl border-2 border-amber-400 max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#164d34] pb-3">
                  <h3 className="text-base font-bold text-amber-300">⚡ सौदा पक्का करें (Confirm Trade & Advance Escrow)</h3>
                  <button onClick={() => setShowBuyModal(null)} className="text-stone-400 hover:text-white font-bold text-xl">×</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="bg-[#051c13] p-3 rounded-lg border border-[#164d34] space-y-1 font-mono">
                    <div className="flex justify-between text-stone-300">
                      <span>मंडी / FPO:</span>
                      <span className="font-bold text-white font-sans">{showBuyModal.mandi} ({showBuyModal.fpo_name})</span>
                    </div>
                    <div className="flex justify-between text-stone-300">
                      <span>फसल एवं मात्रा:</span>
                      <span className="font-bold text-white">{commodity} • {quantityQtl} क्विंटल</span>
                    </div>
                    <div className="flex justify-between text-stone-300">
                      <span>शुद्ध लैंडेड भाव:</span>
                      <span className="font-bold text-amber-300">₹{showBuyModal.net_landed_cost_per_qtl} / qtl</span>
                    </div>
                    <div className="flex justify-between pt-1 border-t border-[#164d34] text-amber-400 font-bold text-sm">
                      <span>कुल इनवॉइस:</span>
                      <span>₹{showBuyModal.total_order_cost?.toLocaleString('en-IN')}</span>
                    </div>
                    <div className="flex justify-between text-emerald-400 font-bold">
                      <span>चरण 1 पेशगी अमानत (20% Advance):</span>
                      <span>₹{showBuyModal.escrow_milestones?.advance_20?.toLocaleString('en-IN')}</span>
                    </div>
                  </div>

                  <div>
                    <label className="block text-stone-300 mb-1">डिलिवरी पता (Mill Address):</label>
                    <textarea
                      rows="2"
                      value={deliveryAddress}
                      onChange={e => setDeliveryAddress(e.target.value)}
                      className="w-full bg-[#051c13] text-stone-100 p-2 rounded border border-[#1c6644]"
                    />
                  </div>

                  <div>
                    <label className="block text-stone-300 mb-1">GSTIN नंबर:</label>
                    <input
                      type="text"
                      value={gstin}
                      onChange={e => setGstin(e.target.value)}
                      className="w-full bg-[#051c13] text-stone-100 font-mono p-2 rounded border border-[#1c6644]"
                    />
                  </div>
                </div>

                <div className="flex space-x-3 pt-2">
                  <button onClick={() => setShowBuyModal(null)} className="flex-1 py-2 rounded bg-stone-700 text-stone-200 font-bold">रद्द करें</button>
                  <button onClick={() => handleExecuteBuy(showBuyModal)} className="flex-1 py-2 rounded bg-amber-400 hover:bg-amber-300 text-slate-950 font-black shadow-lg">20% अमानत जमा कर सौदा पक्का करें</button>
                </div>
              </div>
            </div>
          )}

          {/* SAMPLE MODAL */}
          {showSampleModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#092c1d] rounded-2xl border-2 border-amber-400 max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#164d34] pb-3">
                  <h3 className="text-base font-bold text-amber-300">📦 1 किग्रा सीलबंद नमूना मांगें</h3>
                  <button onClick={() => setShowSampleModal(null)} className="text-stone-400 hover:text-white font-bold text-xl">×</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="bg-[#051c13] p-3 rounded-lg border border-[#164d34] space-y-1 font-mono">
                    <div>लॉट: <b className="text-white">{showSampleModal.id}</b> ({showSampleModal.mandi})</div>
                    <div>कूरियर शुल्क: <b className="text-amber-300">₹450.00 (Flat Fee)</b></div>
                  </div>
                  <div>
                    <label className="block text-stone-300 mb-1">कूरियर प्राप्ति का पता:</label>
                    <textarea
                      rows="2"
                      value={deliveryAddress}
                      onChange={e => setDeliveryAddress(e.target.value)}
                      className="w-full bg-[#051c13] text-stone-100 p-2 rounded border border-[#1c6644]"
                    />
                  </div>
                </div>

                <div className="flex space-x-3 pt-2">
                  <button onClick={() => setShowSampleModal(null)} className="flex-1 py-2 rounded bg-stone-700 text-stone-200 font-bold">रद्द करें</button>
                  <button onClick={() => handleRequestSample(showSampleModal)} className="flex-1 py-2 rounded bg-amber-400 hover:bg-amber-300 text-slate-950 font-black shadow-lg">₹450 भुगतान कर नमूना मंगवाएं</button>
                </div>
              </div>
            </div>
          )}

          {/* LAB ASSAYING REPORT MODAL */}
          {showAssayingModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#092c1d] rounded-2xl border-2 border-emerald-400 max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#164d34] pb-3">
                  <h3 className="text-base font-bold text-emerald-300">🔬 NABL प्रयोगशाला गुणवत्ता रिपोर्ट</h3>
                  <button onClick={() => setShowAssayingModal(null)} className="text-stone-400 hover:text-white font-bold text-xl">×</button>
                </div>

                <div className="space-y-2 text-xs font-mono bg-[#051c13] p-4 rounded-xl border border-[#164d34]">
                  <div className="text-amber-300 font-sans font-bold pb-1 border-b border-[#164d34]">
                    {showAssayingModal.mandi} मंडी • {showAssayingModal.commodity} ({showAssayingModal.variety})
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-300">नमी (Moisture):</span>
                    <span className="font-bold text-white">{showAssayingModal.moisture_percent}% (मानक 11.5%)</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-300">कचरा / धूल:</span>
                    <span className="font-bold text-white">{showAssayingModal.assaying?.foreign_matter_pct || 0.6}%</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-300">टूटे दाने:</span>
                    <span className="font-bold text-white">{showAssayingModal.assaying?.broken_pct || 1.2}%</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-300">प्रोटीन:</span>
                    <span className="font-bold text-white">{showAssayingModal.assaying?.protein_pct || 11.4}%</span>
                  </div>
                </div>

                <button onClick={() => setShowAssayingModal(null)} className="w-full py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs">बंद करें</button>
              </div>
            </div>
          )}

          {/* NEW BID / FPO SELL OFFER MODAL (ADAPTS TO BUYER VS FPO) */}
          {showNewBidModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#092c1d] rounded-2xl border-2 border-amber-400 max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#164d34] pb-3">
                  <div>
                    <h3 className="text-base font-bold text-amber-300">
                      {isFPO ? "🌾 नया FPO बिक्री प्रस्ताव दर्ज करें (Post Sell Offer)" : "+ नई खरीदार मांग बोली दर्ज करें (Post Buy Demand)"}
                    </h3>
                    <p className="text-[11px] text-stone-300">
                      {isFPO ? `FPO: ${currentUser?.name}` : `खरीदार: ${currentUser?.name}`}
                    </p>
                  </div>
                  <button onClick={() => setShowNewBidModal(false)} className="text-stone-400 hover:text-white font-bold text-xl">×</button>
                </div>

                <form onSubmit={handleCreateBid} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-stone-300 mb-1">अनाज (Commodity):</label>
                    <select
                      value={bidForm.commodity}
                      onChange={e => setBidForm({ ...bidForm, commodity: e.target.value })}
                      className="w-full bg-[#051c13] text-stone-100 p-2.5 rounded border border-[#1c6644]"
                    >
                      {CROP_OPTIONS.map(c => <option key={c.id} value={c.id}>{c.hindi}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-stone-300 mb-1">{isFPO ? 'बिक्री हेतु उपलब्ध मात्रा (क्विंटल):' : 'आवश्यक मात्रा (क्विंटल):'}</label>
                    <input
                      type="number"
                      value={bidForm.target_qty_qtl}
                      onChange={e => setBidForm({ ...bidForm, target_qty_qtl: Number(e.target.value) })}
                      className="w-full bg-[#051c13] text-stone-100 font-mono font-bold p-2.5 rounded border border-[#1c6644]"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-stone-300 mb-1">{isFPO ? 'मांग भाव / Ask Price (₹/क्विंटल):' : 'लक्ष्य खरीद भाव / Target Price (₹/क्विंटल):'}</label>
                    <input
                      type="number"
                      value={bidForm.target_bid_price_per_qtl}
                      onChange={e => setBidForm({ ...bidForm, target_bid_price_per_qtl: Number(e.target.value) })}
                      className="w-full bg-[#051c13] text-stone-100 font-mono font-bold p-2.5 rounded border border-[#1c6644]"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-stone-300 mb-1">{isFPO ? 'उत्पत्ति मंडी / स्थान:' : 'गंतव्य शहर (डिलिवरी):'}</label>
                    <select
                      value={bidForm.delivery_city}
                      onChange={e => setBidForm({ ...bidForm, delivery_city: e.target.value })}
                      className="w-full bg-[#051c13] text-stone-100 p-2.5 rounded border border-[#1c6644]"
                    >
                      {CITY_OPTIONS.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>

                  <div className="flex space-x-3 pt-2">
                    <button type="button" onClick={() => setShowNewBidModal(false)} className="flex-1 py-2 rounded bg-stone-700 text-stone-200 font-bold">रद्द करें</button>
                    <button type="submit" className="flex-1 py-2 rounded bg-amber-400 hover:bg-amber-300 text-slate-950 font-black shadow-lg">
                      {isFPO ? "बिक्री प्रस्ताव बोर्ड पर लगाएं" : "मांग बोली बोर्ड पर लगाएं"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* COUNTER OFFER MODAL */}
          {showCounterModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#092c1d] rounded-2xl border-2 border-amber-400 max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#164d34] pb-3">
                  <h3 className="text-base font-bold text-amber-300">🔄 पलट भाव प्रस्ताव (Counter Offer)</h3>
                  <button onClick={() => setShowCounterModal(null)} className="text-stone-400 hover:text-white font-bold text-xl">×</button>
                </div>

                <form onSubmit={handleCounterBid} className="space-y-3 text-xs">
                  <div className="bg-[#051c13] p-2.5 rounded border border-[#164d34] font-mono">
                    <div>बोली आईडी: <b className="text-amber-300">{showCounterModal.bid_id}</b></div>
                    <div>सामने वाले का भाव: <b>₹{showCounterModal.target_bid_price_per_qtl} / qtl</b></div>
                  </div>

                  <div>
                    <label className="block text-stone-300 mb-1">आपका पलट भाव (₹/qtl):</label>
                    <input
                      type="number"
                      value={counterPrice}
                      onChange={e => setCounterPrice(e.target.value)}
                      className="w-full bg-[#051c13] text-stone-100 font-mono font-bold p-2.5 rounded border border-[#1c6644]"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-stone-300 mb-1">टिप्पणी:</label>
                    <textarea
                      rows="2"
                      value={counterNotes}
                      onChange={e => setCounterNotes(e.target.value)}
                      className="w-full bg-[#051c13] text-stone-100 p-2 rounded border border-[#1c6644]"
                    />
                  </div>

                  <div className="flex space-x-3 pt-2">
                    <button type="button" onClick={() => setShowCounterModal(null)} className="flex-1 py-2 rounded bg-stone-700 text-stone-200 font-bold">रद्द करें</button>
                    <button type="submit" className="flex-1 py-2 rounded bg-amber-400 hover:bg-amber-300 text-slate-950 font-black shadow-lg">पलट भाव भेजें</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* E-WAY BILL MODAL */}
          {showEwayModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#092c1d] rounded-2xl border-2 border-emerald-400 max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#164d34] pb-3">
                  <h3 className="text-base font-bold text-emerald-300">📜 12-अंकीय GST ई-वे बिल रसीद</h3>
                  <button onClick={() => setShowEwayModal(null)} className="text-stone-400 hover:text-white font-bold text-xl">×</button>
                </div>

                <div className="bg-[#051c13] p-4 rounded-xl border border-[#164d34] text-xs font-mono space-y-2">
                  <div className="text-center pb-2 border-b border-[#164d34]">
                    <div className="text-stone-400">e-Way Bill No.</div>
                    <div className="text-lg font-black text-amber-300 tracking-wider">{showEwayModal.eway_bill_no}</div>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-400">ऑर्डर reference:</span>
                    <span className="font-bold text-white">{showEwayModal.order_id}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-400">खरीदार GSTIN:</span>
                    <span className="font-bold text-white">{showEwayModal.gstin}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-400">मात्रा:</span>
                    <span className="font-bold text-white">{showEwayModal.quantity_qtl} क्विंटल</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-400">कुल इनवॉइस:</span>
                    <span className="font-bold text-amber-300">₹{showEwayModal.total_invoice_amount?.toLocaleString('en-IN')}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-400">सत्यापन:</span>
                    <span className="font-bold text-emerald-400 font-sans">✓ CGST Rule 138 सत्यापित</span>
                  </div>
                </div>

                <button onClick={() => setShowEwayModal(null)} className="w-full py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs">बंद करें</button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-[#03170f] border-t border-[#12422c] py-4 text-center text-xs text-stone-400 font-medium">
            किसान व्यापार मंडी डेस्क • राष्ट्रीय कृषि थोक व्यापार एवं सुरक्षित अमानत प्रणाली • All Mandi Statutory Rules & GST Compliant
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
