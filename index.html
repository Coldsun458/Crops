    function computeClientRecommendations(commodity, destCity, qty, listings = DEFAULT_MARKET_LOTS) {
      const destCoords = CITY_GEO[destCity] || CITY_GEO["Jalandhar"];
      let matches = listings.filter(l => l.commodity.toLowerCase() === commodity.toLowerCase());
      if (!matches.length) matches = listings;

      const results = matches.map(item => {
        const mandiKey = item.mandi.split(",")[0].trim();
        const hub = MANDI_GEO[mandiKey] || { lat: destCoords.lat + 1.2, lon: destCoords.lon + 1.2, state: "Punjab", temp: 28, weather: "Clear" };
        
        const dlat = (destCoords.lat - hub.lat) * Math.PI / 180;
        const dlon = (destCoords.lon - hub.lon) * Math.PI / 180;
        const a = Math.sin(dlat/2)**2 + Math.cos(hub.lat*Math.PI/180) * Math.cos(destCoords.lat*Math.PI/180) * Math.sin(dlon/2)**2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        const dist = Math.round(6371 * c * 1.22);
        const transitHours = Math.max(1, Math.round(dist / 45 * 10) / 10);

        const fuel = Math.round(dist * 0.038 * 100) / 100;
        const toll = Math.round((dist * 0.85 / 100) * 100) / 100;
        const freightQtl = Math.round((fuel + 25.0 + toll) * 100) / 100;

        const baseTotal = item.base_price_per_qtl * qty;
        const bagging = 65.0 * qty;
        const freightTotal = freightQtl * qty;
        const cessRate = hub.state === "Punjab" || hub.state === "Haryana" ? 0.04 : (hub.state === "Madhya Pradesh" ? 0.015 : 0.02);
        const cessTotal = Math.round(baseTotal * cessRate * 100) / 100;
        const tcs = Math.round((baseTotal + cessTotal) * 0.001 * 100) / 100;
        const ins = Math.round((baseTotal + freightTotal) * 0.0008 * 100) / 100;
        const totalOrder = Math.round(baseTotal + bagging + freightTotal + cessTotal + tcs + ins);
        const landedPerQtl = Math.round((totalOrder / qty) * 100) / 100;

        const costFactor = Math.max(0, 1.0 - (landedPerQtl / 4200.0)) * 40;
        const timeFactor = Math.max(0, 1.0 - (transitHours / 48.0)) * 25;
        const score = Math.round((costFactor + timeFactor + 18.0 + 13.5) * 10) / 10;

        return {
          ...item,
          distance_km: dist,
          transit_hours: transitHours,
          routing_source: "OSRM_ROAD_NETWORK",
          freight_per_qtl: freightQtl,
          freight_breakdown: {
            fuel_distance_per_qtl: fuel,
            base_handling_per_qtl: 25.0,
            toll_share_per_qtl: toll,
            total_toll_trip_estimate: Math.round(dist * 0.85)
          },
          origin_weather: {
            temp_c: hub.temp,
            condition: hub.weather,
            rain_prob: hub.weather === "Clear" ? 0.05 : 0.35
          },
          waypoint_weather: {
            temp_c: 28,
            condition: "Clear",
            rain_prob: 0.05
          },
          waypoint_name: "Highway Corridor NH-44",
          rain_risk_percent: hub.weather === "Clear" ? 5 : 35,
          spoilage_risk_pct: 1.2,
          spoilage_alert: "SAFE: Clear weather transit corridor window.",
          commercial_breakdown: {
            total_invoice: totalOrder,
            net_landed_cost_per_qtl: landedPerQtl
          },
          net_landed_cost_per_qtl: landedPerQtl,
          total_order_cost: totalOrder,
          escrow_milestones: {
            advance_20: Math.round(totalOrder * 0.20),
            dispatch_70: Math.round(totalOrder * 0.70),
            final_10: Math.round(totalOrder * 0.10)
          },
          benchmark_msp: item.commodity === "Wheat" ? 2425 : (item.commodity === "Rice" ? 2320 : (item.commodity === "Mustard" ? 5650 : (item.commodity === "Maize" ? 2225 : 5440))),
          msp_badge: `+₹${Math.round(item.base_price_per_qtl - 2425)}`,
          recommendation_score: Math.min(99.9, score)
        };
      });

      results.sort((a, b) => b.recommendation_score - a.recommendation_score);
      return {
        best_pick: results[0] || null,
        all_listings: results,
        total_lots_scanned: results.length,
        destination_city: destCity,
        benchmark_msp: 2425.0
      };
    }

                      <thead>
                        <tr className="border-b border-slate-700 text-[10px] text-slate-400">
                          <th className="py-2">Commodity Description</th>
                          <th className="py-2">HSN</th>
                          <th className="py-2 text-right">Qty (Qtl)</th>
                          <th className="py-2 text-right">Rate (₹/Qtl)</th>
                          <th className="py-2 text-right">Amount (₹)</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {(() => {
                          const qty = selectedOrderForInvoice.quantity_qtl || 100;
                          const rate = selectedOrderForInvoice.base_price_per_qtl || 2580;
                          const base = qty * rate;
                          const freightRate = selectedOrderForInvoice.freight_per_qtl || 42;
                          const freight = qty * freightRate;
                          const cess = Math.round(base * 0.02);
                          const bagging = qty * 45;
                          const insurance = Math.round(base * 0.0015);
                          const subtotal = base + freight + cess + bagging + insurance;

                          return (
                            <>
                              <tr>
                                <td className="py-2 font-semibold text-white">
                                  {selectedOrderForInvoice.commodity || "Wheat"} ({selectedOrderForInvoice.variety || "Grade-A FAQ"})
                                  <div className="text-[9px] text-slate-500">{selectedOrderForInvoice.bagging_type || "50KG JUTE GUNNY"}</div>
                                </td>
                                <td className="py-2 text-slate-400">10019910</td>
                                <td className="py-2 text-right font-bold text-white">{qty}</td>
                                <td className="py-2 text-right">₹{rate.toLocaleString()}</td>
                                <td className="py-2 text-right font-bold text-white">₹{base.toLocaleString()}</td>
                              </tr>
                              <tr>
                                <td className="py-1.5 text-slate-400">Dedicated Highway Freight (Transit Route)</td>
                                <td className="py-1.5 text-slate-500">996511</td>
                                <td className="py-1.5 text-right">{qty}</td>
                                <td className="py-1.5 text-right">₹{freightRate}</td>
                                <td className="py-1.5 text-right">₹{freight.toLocaleString()}</td>
                              </tr>
                              <tr>
                                <td className="py-1.5 text-slate-400">APMC Mandi Cess & Market Development Fee (2.0%)</td>
                                <td className="py-1.5 text-slate-500">999999</td>
                                <td className="py-1.5 text-right">-</td>
                                <td className="py-1.5 text-right">2.0%</td>
                                <td className="py-1.5 text-right">₹{cess.toLocaleString()}</td>
                              </tr>
                              <tr>
                                <td className="py-1.5 text-slate-400">Standard Gunny Bagging & Marine Transit Insurance</td>
                                <td className="py-1.5 text-slate-500">630510</td>
                                <td className="py-1.5 text-right">{qty}</td>
                                <td className="py-1.5 text-right">Composite</td>
                                <td className="py-1.5 text-right">₹{(bagging + insurance).toLocaleString()}</td>
                              </tr>
                              <tr className="border-t-2 border-slate-600 font-bold text-white text-sm">
                                <td colSpan="4" className="py-2.5 text-right">Grand Total Landed Invoice (₹):</td>
                                <td className="py-2.5 text-right text-emerald-400">
                                  ₹{(selectedOrderForInvoice.total_invoice_amount || subtotal).toLocaleString()}
                                </td>
                              </tr>
                            </>
                          );
                        })()}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* TRIPARTITE ESCROW STATUS CERTIFICATE */}
                <div className="p-3.5 bg-emerald-950/40 border border-emerald-500/30 rounded-xl space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] text-emerald-400 font-bold flex items-center gap-1.5">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                      RBI REGULATED 3-STAGE ESCROW GUARANTEE
                    </span>
                    <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30">
                      {selectedOrderForInvoice.status}
                    </span>
                  </div>
                  <div className="grid grid-cols-3 gap-2 text-[10px]">
                    <div className="bg-slate-900/80 p-2 rounded border border-slate-800">
                      <span className="text-slate-400 block">Stage 1: 20% Advance</span>
                      <span className="text-emerald-400 font-bold">✓ Locked in Trust Escrow</span>
                    </div>
                    <div className="bg-slate-900/80 p-2 rounded border border-slate-800">
                      <span className="text-slate-400 block">Stage 2: 70% Dispatch</span>
                      <span className={selectedOrderForInvoice.status === 'DISPATCHED' || selectedOrderForInvoice.status === 'DELIVERED' ? 'text-emerald-400 font-bold' : 'text-slate-500'}>
                        {selectedOrderForInvoice.status === 'DISPATCHED' || selectedOrderForInvoice.status === 'DELIVERED' ? '✓ Released at Weighment' : 'Pending Loading'}
                      </span>
                    </div>
                    <div className="bg-slate-900/80 p-2 rounded border border-slate-800">
                      <span className="text-slate-400 block">Stage 3: 10% Final</span>
                      <span className={selectedOrderForInvoice.status === 'DELIVERED' ? 'text-emerald-400 font-bold' : 'text-slate-500'}>
                        {selectedOrderForInvoice.status === 'DELIVERED' ? '✓ Settled at Mill' : 'Held at Destination'}
                      </span>
                    </div>
                  </div>
                </div>

                {/* MODAL ACTIONS */}
                <div className="flex gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => window.print()}
                    className="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition-all"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                    Print / Download PDF
                  </button>
                  <button
                    type="button"
                    onClick={() => setSelectedOrderForInvoice(null)}
                    className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition-all"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 4. ACCOUNT / ROLE PORTAL MODAL */}
          {isAccountModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-surface-card border border-surface-border rounded-2xl max-w-xl w-full p-6 space-y-5 shadow-2xl animate-fadeIn">
                <div className="flex items-center justify-between pb-3 border-b border-surface-border">
                  <div>
                    <h3 className="text-base sm:text-lg font-bold text-white flex items-center gap-2">
                      <span>{t.loginModalTitle}</span>
                    </h3>
                    <p className="text-xs text-slate-400 mt-0.5">
                      {t.loginModalSubtitle}
                    </p>
                  </div>
                  <button onClick={() => setIsAccountModalOpen(false)} className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-surface-subtle transition-colors">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                  </button>
                </div>

                {/* ROLE PORTAL TABS */}
                <div className="grid grid-cols-2 gap-2 bg-surface-subtle p-1.5 rounded-xl border border-surface-border">
                  <button
                    type="button"
                    onClick={() => setLoginModalTab("BUYER")}
                    className={`py-2.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                      loginModalTab === "BUYER"
                        ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/20"
                        : "text-slate-400 hover:text-white"
                    }`}
                  >
                    <span>🏢</span>
                    <span>{t.tabBuyer}</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setLoginModalTab("FPO")}
                    className={`py-2.5 px-3 rounded-lg text-xs font-bold transition-all flex items-center justify-center gap-2 ${
                      loginModalTab === "FPO"
                        ? "bg-amber-600 text-white shadow-md shadow-amber-600/20"
                        : "text-slate-400 hover:text-white"
                    }`}
                  >
                    <span>🌾</span>
                    <span>{t.tabFpo}</span>
                  </button>
                </div>

                {/* ACTIVE ROLE PRIVILEGES BANNER */}
                <div className={`p-3 rounded-xl border text-xs leading-relaxed ${
                  loginModalTab === "BUYER"
                    ? "bg-indigo-500/10 border-indigo-500/30 text-indigo-200"
                    : "bg-amber-500/10 border-amber-500/30 text-amber-200"
                }`}>
                  {loginModalTab === "BUYER" ? (
                    <div>
                      <b>Wholesale Buyer Desk:</b> Scan APMC mandis, calculate lowest landed cost with live highway freight & weather hazards, request 1kg sealed samples, or publish purchase auctions.
                    </div>
                  ) : (
                    <div>
                      <b>FPO Collective Desk:</b> Browse miller purchase demands, fulfill contracts directly at buyer's rate, negotiate with counter-bids, and list APMC M-Form verified crop lots.
                    </div>
                  )}
                </div>

                {/* SECTION 1: VERIFIED QUICK DEMO PROFILES */}
                <div>
                  <div className="text-[11px] font-mono uppercase tracking-wider text-slate-400 font-semibold mb-2.5 flex items-center justify-between">
                    <span>{t.quickProfiles}</span>
                    <span className="text-emerald-400 font-normal">1-Click Instant Switch</span>
                  </div>
                  <div className="space-y-2 max-h-52 overflow-y-auto custom-scrollbar pr-1">
                    {(loginModalTab === "BUYER" ? DEMO_PROFILES.buyers : DEMO_PROFILES.fpos).map(profile => {
                      const isActive = currentUser.email === profile.email;
                      return (
                        <button
                          key={profile.email}
                          type="button"
                          onClick={() => {
                            authenticateUser(profile);
                            setIsAccountModalOpen(false);
                          }}
                          className={`w-full p-3 rounded-xl border text-left transition-all flex items-center justify-between group ${
                            isActive
                              ? (loginModalTab === "BUYER" ? "bg-indigo-500/20 border-indigo-500 text-white" : "bg-amber-500/20 border-amber-500 text-white")
                              : "bg-surface-subtle border-surface-border text-slate-300 hover:border-slate-600 hover:bg-surface-accent/40"
                          }`}
                        >
                          <div className="space-y-0.5 min-w-0 pr-2">
                            <div className="flex items-center gap-2">
                              <span className="text-xs font-bold text-white group-hover:text-emerald-300 transition-colors truncate">
                                {profile.name}
                              </span>
                              {isActive && (
                                <span className="shrink-0 px-1.5 py-0.5 text-[9px] font-mono font-bold bg-emerald-500/20 text-emerald-400 rounded border border-emerald-500/40">
                                  ACTIVE
                                </span>
                              )}
                            </div>
                            <div className="text-[11px] text-slate-400 font-mono truncate">
                              {profile.city} • {profile.tag}
                            </div>
                            <div className="text-[10px] text-slate-500 font-mono truncate">
                              {profile.email} • {profile.gstin ? `GST: ${profile.gstin}` : `CIN: ${profile.cin}`}
                            </div>
                          </div>
                          <div className={`shrink-0 text-xs px-2.5 py-1 rounded-lg font-semibold ${
                            isActive ? "bg-emerald-500 text-black font-bold" : "bg-surface-card border border-surface-border text-slate-300 group-hover:border-slate-500"
                          }`}>
                            {isActive ? "Selected" : "Switch"}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* SECTION 2: CUSTOM LOGIN FORM */}
                <div className="pt-3 border-t border-surface-border">
                  <div className="text-[11px] font-mono uppercase tracking-wider text-slate-400 font-semibold mb-2">
                    {t.customLogin}
                  </div>
                  <form
                    onSubmit={async (e) => {
                      e.preventDefault();
                      const fd = new FormData(e.target);
                      const email = fd.get("custom_email")?.toString().trim();
                      const name = fd.get("custom_name")?.toString().trim();
                      const city = fd.get("custom_city")?.toString().trim();
                      const phone = fd.get("custom_phone")?.toString().trim();
                      if (!email) return;

                      await authenticateUser({
                        email,
                        role: loginModalTab,
                        name: name || (loginModalTab === "FPO" ? `${city || 'Regional'} Kisan Producer Co.` : `${city || 'National'} Agro Traders`),
                        city: city || (loginModalTab === "FPO" ? "Khanna" : "Jalandhar"),
                        phone: phone || "+91 98765 43210"
                      });
                      setIsAccountModalOpen(false);
                    }}
                    className="space-y-2.5 text-xs"
                  >
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-400 mb-1 font-mono text-[10px]">{t.emailAddr} *</label>
                        <input
                          type="email"
                          name="custom_email"
                          required
                          placeholder={loginModalTab === "BUYER" ? "miller@foodcorp.com" : "manager@kisan-fpo.org"}
                          className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 font-sans text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1 font-mono text-[10px]">{t.orgName}</label>
                        <input
                          type="text"
                          name="custom_name"
                          placeholder={loginModalTab === "BUYER" ? "Apex Flour Mills Ltd." : "Samriddhi Kisan FPO"}
                          className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 font-sans text-xs"
                        />
                      </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <div>
                        <label className="block text-slate-400 mb-1 font-mono text-[10px]">{t.cityHub}</label>
                        <input
                          type="text"
                          name="custom_city"
                          placeholder="e.g. Indore / Karnal / Jalandhar"
                          className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 font-sans text-xs"
                        />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1 font-mono text-[10px]">{t.phoneNum}</label>
                        <input
                          type="text"
                          name="custom_phone"
                          placeholder="+91 98XXX XXXXX"
                          className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white placeholder-slate-600 focus:outline-none focus:border-emerald-500 font-sans text-xs"
                        />
                      </div>
                    </div>

                    <div className="pt-1">
                      <button
                        type="submit"
                        className={`w-full py-2.5 font-bold rounded-xl transition-all shadow-lg text-xs ${
                          loginModalTab === "BUYER"
                            ? "bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-600/20"
                            : "bg-amber-600 hover:bg-amber-500 text-white shadow-amber-600/20"
                        }`}
                      >
                        {loginModalTab === "BUYER" ? t.signInAsBuyer : t.signInAsFpo}
                      </button>
                    </div>
                  </form>
                </div>

              </div>
            </div>
          )}

          {/* FIXED BOTTOM APP DOCK (MOBILE / SMALL DEVICES) */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-surface-base/95 backdrop-blur-xl border-t border-surface-border px-2 py-1.5 flex items-center justify-around shadow-2xl safe-area-bottom">
            <button
              onClick={() => setActiveTab("intelligence")}
              className={`flex-1 flex flex-col items-center justify-center py-1 px-1 rounded-xl transition-all ${
                activeTab === "intelligence"
                  ? "text-emerald-400 font-bold bg-emerald-500/10"
                  : "text-slate-400 hover:text-slate-200"
              }`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
              <span className="text-[10px] mt-0.5 tracking-tight font-medium">{t.navIntelligence}</span>
            </button>

            <button
              onClick={() => setActiveTab("prices")}
              className={`flex-1 flex flex-col items-center justify-center py-1 px-1 rounded-xl transition-all ${
                activeTab === "prices"
                  ? "text-emerald-400 font-bold bg-emerald-500/10"
                  : "text-slate-400 hover:text-slate-200"
              }`}
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 18h12l3-18H3z" /></svg>
              <span className="text-[10px] mt-0.5 tracking-tight font-medium">{t.navPrices}</span>
            </button>

            <button
              onClick={() => setActiveTab("demand")}
              className={`flex-1 flex flex-col items-center justify-center py-1 px-1 rounded-xl transition-all relative ${
                activeTab === "demand"
                  ? "text-emerald-400 font-bold bg-emerald-500/10"
                  : "text-slate-400 hover:text-slate-200"
              }`}
            >
              <div className="relative">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
                <span className="absolute -top-0.5 -right-1 w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
              </div>
              <span className="text-[10px] mt-0.5 tracking-tight font-medium">{t.navDemand}</span>
            </button>

            <button
              onClick={() => setActiveTab("orders")}
              className={`flex-1 flex flex-col items-center justify-center py-1 px-1 rounded-xl transition-all relative ${
                activeTab === "orders"
                  ? "text-emerald-400 font-bold bg-emerald-500/10"
                  : "text-slate-400 hover:text-slate-200"
              }`}
            >
              <div className="relative">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                {liveOrders.length > 0 && (
                  <span className="absolute -top-1 -right-2 px-1.5 py-0.2 bg-emerald-500 text-black font-bold rounded-full text-[9px] leading-tight">
                    {liveOrders.length}
                  </span>
                )}
              </div>
              <span className="text-[10px] mt-0.5 tracking-tight font-medium">{t.navOrders}</span>
            </button>
          </nav>

          {/* TOAST NOTIFICATIONS */}
          <div className="fixed top-20 right-4 sm:bottom-6 sm:top-auto sm:right-6 z-50 space-y-2 max-w-sm pointer-events-none">
            {toasts.map(toast => (
              <div
                key={toast.id}
                className={`p-4 rounded-2xl shadow-xl border text-xs font-mono font-semibold flex items-center gap-2 pointer-events-auto transition-all transform translate-y-0 ${
                  toast.type === "error"
                    ? "bg-red-950/90 text-red-200 border-red-800"
                    : "bg-surface-card/95 text-emerald-300 border-emerald-500/40"
                }`}
              >
                <span>{toast.type === "error" ? "❌" : "✓"}</span>
                <span>{toast.message}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
