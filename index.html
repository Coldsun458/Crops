        }, 4000);

            body: JSON.stringify({ email: userObj.email, otp: "123456" })

            setToken(data.access_token);
            setCurrentUser(data.user);
            showToast(`Logged in as ${data.user.name} (${data.user.role})`);
          }
        } catch (err) {
          console.error("Auth error:", err);
        }
      };

        } catch (e) {
          console.error("Failed to fetch lots:", e);
        }
      };

              buyer_city: destinationCity,
              quantity_qtl: Number(requiredQty) || 100

        try {

            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            }
          });
          const data = await res.json();
          if (res.ok) {
            showToast(data.message || "Contract accepted! Escrow locked.");
            fetchLiveBids();
            fetchLiveOrders();
          } else {
            showToast(data.detail || "Error accepting bid", "error");
          }
        } catch (e) {
          showToast("Network error accepting bid", "error");
        }
      };

          if (res.ok) {

            fetchLiveOrders();
          } else {
            showToast(data.detail || "Error accepting counter", "error");

        } catch (e) {
          showToast("Network error accepting counter", "error");

                    <select
                      value={priceCropFilter}
                      onChange={(e) => setPriceCropFilter(e.target.value)}
                      className="bg-surface-subtle border border-surface-border text-xs rounded-xl px-3 py-2 text-white focus:outline-none focus:border-emerald-500 font-sans"
                    >
                      <option value="ALL">{t.allCommodities}</option>
                      {CROP_CATALOG.map(c => <option key={c.id} value={c.id}>{c.id}</option>)}
                    </select>
                  </div>
                </div>

                {/* PRICES TABLE */}
                <div className="bg-surface-card border border-surface-border rounded-2xl overflow-hidden shadow-xl">
                  <div className="overflow-x-auto custom-scrollbar">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="border-b border-surface-border text-slate-400 font-mono uppercase text-[11px] bg-surface-subtle/50">
                          <th className="py-3 px-4">{t.mandiLocation}</th>
                          <th className="py-3 px-4">{t.commodity}</th>
                          <th className="py-3 px-4">{t.baseMandiPrice}</th>
                          <th className="py-3 px-4">{t.stockAvailable}</th>
                          <th className="py-3 px-4">{t.moisture}</th>
                          <th className="py-3 px-4">{t.fpoProducer}</th>
                          <th className="py-3 px-4 text-right">{t.action}</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-surface-border/60 font-mono">
                        {filteredLots.map(lot => (
                          <tr key={lot.id} className="hover:bg-surface-accent/30 transition-colors">
                            <td className="py-3 px-4">
                              <div className="font-bold text-white font-sans text-sm">{lot.mandi}</div>
                              <div className="text-[10px] text-emerald-400 font-mono">M-Form Verified</div>
                            </td>
                            <td className="py-3 px-4 font-sans font-medium text-slate-200">
                              {lot.commodity} • <span className="text-slate-400 text-xs">{lot.variety}</span>
                            </td>
                            <td className="py-3 px-4 font-bold text-emerald-400 text-sm">
                              ₹{lot.base_price_per_qtl.toLocaleString()}
                              <span className="text-xs text-slate-500 font-normal">/qtl</span>
                            </td>
                            <td className="py-3 px-4 text-slate-200 font-bold">
                              {lot.available_qty_qtl} Qtl
                            </td>
                            <td className="py-3 px-4">
                              <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                                lot.moisture_percent <= 12 ? "bg-emerald-500/20 text-emerald-300" : "bg-amber-500/20 text-amber-300"
                              }`}>
                                {lot.moisture_percent}%
                              </span>
                            </td>
                            <td className="py-3 px-4 font-sans text-slate-300">
                              {lot.fpo_name}
                            </td>
                            <td className="py-3 px-4 text-right space-x-2 whitespace-nowrap">
                              <button
                                onClick={() => {
                                  setSelectedLotForOrder(lot);
                                  setIsBuyModalOpen(true);
                                }}
                                className="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs rounded-lg transition-all"
                              >
                                {t.buy}
                              </button>
                              <button
                                onClick={() => handleRequestSample(lot)}
                                className="px-3 py-1.5 bg-surface-subtle hover:bg-surface-accent border border-surface-border text-slate-300 text-xs rounded-lg transition-all"
                              >
                                {t.sample}
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* 4. ORDERS & ESCROW SETTLEMENTS */}
            {activeTab === "orders" && (
              <div className="space-y-6 animate-fadeIn">
                <div>
                  <h2 className="text-2xl font-bold text-white tracking-tight">
                    {t.ordersTitle}
                  </h2>
                  <p className="text-xs text-slate-400 mt-1">
                    {t.ordersSubtitle}
                  </p>
                </div>

                <div className="space-y-4">
                  {liveOrders.length === 0 ? (
                    <div className="bg-surface-card border border-surface-border rounded-2xl p-12 text-center text-slate-400 font-mono text-xs">
                      No commercial orders placed yet. Execute an order via the Procurement AI or Demand Exchange to see live escrow settlements.
                    </div>
                  ) : (
                    liveOrders.map(ord => (
                      <div key={ord.order_id} className="bg-surface-card border border-surface-border rounded-2xl p-6 space-y-4 shadow-lg">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-surface-border">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="text-sm font-bold text-white font-mono">{ord.order_id}</span>
                              <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-emerald-500/20 text-emerald-400 font-bold border border-emerald-500/30">
                                {ord.status}
                              </span>
                            </div>
                            <div className="text-xs text-slate-400 font-mono mt-1">
                              GST E-Way Bill: <span className="text-slate-200">{ord.eway_bill_no}</span> • Quantity: <span className="text-white font-bold">{ord.quantity_qtl} Qtl</span>
                            </div>
                          </div>

                          <div className="text-right font-mono">
                            <div className="text-xs text-slate-400">{t.totalAmount}</div>
                            <div className="text-lg font-extrabold text-emerald-400">
                              ₹{ord.total_invoice_amount.toLocaleString()}
                            </div>
                          </div>
                        </div>

                        {/* 3-STAGE ESCROW STATUS VISUALIZER */}
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 font-mono text-xs">
                          <div className={`p-3 rounded-xl border ${
                            ord.status === "ADVANCE_ESCROW_LOCKED" || ord.status === "DISPATCHED" || ord.status === "DELIVERED"
                              ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-300"
                              : "bg-surface-base border-surface-border text-slate-500"
                          }`}>
                            <div className="text-[10px] uppercase">{t.advance20} (20%)</div>
                            <div className="text-sm font-bold mt-0.5">₹{ord.escrow_stages?.advance_20_pct?.toLocaleString()}</div>
                            <div className="text-[10px] mt-1 text-emerald-400">✓ Locked in Bank Escrow</div>
                          </div>

                          <div className={`p-3 rounded-xl border ${
                            ord.status === "DISPATCHED" || ord.status === "DELIVERED"
                              ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-300"
                              : "bg-surface-base border-surface-border text-slate-500"
                          }`}>
                            <div className="text-[10px] uppercase">{t.dispatch70} (70%)</div>
                            <div className="text-sm font-bold mt-0.5">₹{ord.escrow_stages?.dispatch_70_pct?.toLocaleString()}</div>
                            <div className="text-[10px] mt-1">
                              {ord.status === "DISPATCHED" || ord.status === "DELIVERED" ? "✓ Released on Weighment Loading" : "Pending Truck Loading"}
                            </div>
                          </div>

                          <div className={`p-3 rounded-xl border ${
                            ord.status === "DELIVERED"
                              ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-300"
                              : "bg-surface-base border-surface-border text-slate-500"
                          }`}>
                            <div className="text-[10px] uppercase">{t.final10} (10%)</div>
                            <div className="text-sm font-bold mt-0.5">₹{ord.escrow_stages?.final_10_pct?.toLocaleString()}</div>
                            <div className="text-[10px] mt-1">
                              {ord.status === "DELIVERED" ? "✓ Final Settlement Complete" : "Held until Mill Weighment"}
                            </div>
                          </div>
                        </div>

                        {/* STAGE TRANSITION ACTIONS */}
                        <div className="flex items-center gap-3 pt-2">
                          {ord.status === "ADVANCE_ESCROW_LOCKED" && (
                            <button
                              onClick={() => handleDispatchOrder(ord.order_id)}
                              className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow transition-all font-mono"
                            >
                              🚀 {t.dispatchOrder} (Release 70% Escrow)
                            </button>
                          )}

                          {ord.status === "DISPATCHED" && (
                            <button
                              onClick={() => handleDeliverOrder(ord.order_id)}
                              className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs rounded-xl shadow transition-all font-mono"
                            >
                              🏁 {t.deliverOrder} (Release Final 10% Escrow)
                            </button>
                          )}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="border-t border-surface-border bg-surface-subtle/80 py-6 text-center text-xs text-slate-500 font-mono">
            AgriTrade Intelligence Desk • High-Throughput Grain Logistics & APMC Trading Protocol • 2026
          </footer>

          {/* --- MODALS --- */}

          {/* 1. PLACE BID / OFFER MODAL */}
          {isPlaceBidOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-surface-card border border-surface-border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-surface-border">
                  <h3 className="text-base font-bold text-white">
                    {currentUser.role === "FPO" ? "Post FPO Supply Bid" : t.modalPlaceBidTitle}
                  </h3>
                  <button onClick={() => setIsPlaceBidOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  try {
                    const res = await fetch("/api/v1/bids/create", {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                      },
                      body: JSON.stringify({
                        commodity: fd.get("commodity"),
                        target_qty_qtl: Number(fd.get("target_qty_qtl")),
                        target_bid_price_per_qtl: Number(fd.get("target_bid_price_per_qtl")),
                        delivery_city: fd.get("delivery_city")
                      })
                    });
                    const data = await res.json();
                    if (res.ok) {
                      showToast(data.message || "Bid placed successfully!");
                      setIsPlaceBidOpen(false);
                      fetchLiveBids();
                    } else {
                      showToast(data.detail || "Error placing bid", "error");
                    }
                  } catch (err) {
                    showToast("Network error", "error");
                  }
                }} className="space-y-4 text-xs font-mono">
                  <div>
                    <label className="block text-slate-400 mb-1">{t.selectCrop}</label>
                    <select name="commodity" className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white">
                      {CROP_CATALOG.map(c => <option key={c.id} value={c.id}>{c.id}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 mb-1">{t.targetQty}</label>
                      <input type="number" name="target_qty_qtl" defaultValue="300" min="10" required className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white font-bold" />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">{currentUser.role === "FPO" ? "Asking Price (₹/qtl)" : "Target Price (₹/qtl)"}</label>
                      <input type="number" name="target_bid_price_per_qtl" defaultValue="2550" min="100" required className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white font-bold" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">{t.deliveryCity}</label>
                    <select name="delivery_city" className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white">
                      {DESTINATION_HUBS.map(h => <option key={h.id} value={h.id}>{h.label}</option>)}
                    </select>
                  </div>

                  <div className="flex gap-3 pt-3">
                    <button type="button" onClick={() => setIsPlaceBidOpen(false)} className="flex-1 py-2.5 bg-surface-subtle hover:bg-surface-accent border border-surface-border text-white rounded-xl">
                      {t.cancel}
                    </button>
                    <button type="submit" className="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-xl shadow-lg shadow-emerald-500/20">
                      {t.confirm}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 2. COUNTER OFFER MODAL */}
          {isCounterOpen && selectedBidForCounter && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-surface-card border border-surface-border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-surface-border">
                  <h3 className="text-base font-bold text-white">{t.modalCounterTitle}</h3>
                  <button onClick={() => setIsCounterOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-3 bg-surface-base rounded-xl text-xs font-mono space-y-1">
                  <div>Buyer: <b className="text-white">{selectedBidForCounter.buyer_name}</b></div>
                  <div>Commodity: <b className="text-white">{selectedBidForCounter.commodity} ({selectedBidForCounter.target_qty_qtl} Qtl)</b></div>
                  <div>Buyer's Bid: <b className="text-emerald-400">₹{selectedBidForCounter.target_bid_price_per_qtl}/qtl</b></div>
                </div>

                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  try {
                    const res = await fetch(`/api/v1/bids/${selectedBidForCounter.bid_id}/counter`, {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                      },
                      body: JSON.stringify({
                        counter_price_per_qtl: Number(fd.get("counter_price_per_qtl")),
                        counter_notes: fd.get("counter_notes") || "FPO standard commercial counter quote"
                      })
                    });
                    const data = await res.json();
                    if (res.ok) {
                      showToast(data.message || "Counter offer submitted!");
                      setIsCounterOpen(false);
                      fetchLiveBids();
                    } else {
                      showToast(data.detail || "Failed to submit counter", "error");
                    }
                  } catch (err) {
                    showToast("Network error", "error");
                  }
                }} className="space-y-4 text-xs font-mono">
                  <div>
                    <label className="block text-slate-400 mb-1">{t.counterPrice}</label>
                    <input type="number" name="counter_price_per_qtl" defaultValue={selectedBidForCounter.target_bid_price_per_qtl + 40} required className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white font-bold" />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">Notes</label>
                    <input type="text" name="counter_notes" defaultValue="Moisture certified <11.5% with premium B-Twill packaging" className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div className="flex gap-3 pt-3">
                    <button type="button" onClick={() => setIsCounterOpen(false)} className="flex-1 py-2.5 bg-surface-subtle hover:bg-surface-accent border border-surface-border text-white rounded-xl">
                      {t.cancel}
                    </button>
                    <button type="submit" className="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl shadow-lg shadow-purple-600/20">
                      Submit Counter
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 3. COMMERCIAL ORDER & ESCROW CHECKOUT MODAL */}
          {isBuyModalOpen && selectedLotForOrder && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-surface-card border border-surface-border rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-surface-border">
                  <h3 className="text-base font-bold text-white">{t.modalOrderTitle}</h3>
                  <button onClick={() => setIsBuyModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="p-3 bg-surface-base rounded-xl text-xs font-mono space-y-1">
                  <div>Origin Mandi: <b className="text-white">{selectedLotForOrder.mandi}</b></div>
                  <div>Commodity: <b className="text-white">{selectedLotForOrder.commodity} ({selectedLotForOrder.variety})</b></div>
                  <div>Base Price: <b className="text-emerald-400">₹{selectedLotForOrder.base_price_per_qtl}/qtl</b></div>
                </div>

                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  try {
                    const res = await fetch("/api/v1/orders/buy", {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                      },
                      body: JSON.stringify({
                        lot_id: selectedLotForOrder.id,
                        quantity_qtl: Number(fd.get("quantity_qtl")),
                        delivery_address: fd.get("delivery_address"),
                        gstin: fd.get("gstin"),
                        payment_method: "ESCROW_UPI",
                        bagging_type: "50KG_JUTE_GUNNY",
                        transit_insurance_opted: true
                      })
                    });
                    const data = await res.json();
                    if (res.ok) {
                      showToast(data.message || "Order confirmed! 20% Escrow locked.");
                      setIsBuyModalOpen(false);
                      setActiveTab("orders");
                      fetchLiveOrders();
                      fetchMarketLots();
                    } else {
                      showToast(data.detail || "Error creating order", "error");
                    }
                  } catch (err) {
                    showToast("Network error creating order", "error");
                  }
                }} className="space-y-3 text-xs font-mono">
                  <div>
                    <label className="block text-slate-400 mb-1">{t.quantityRequired}</label>
                    <input type="number" name="quantity_qtl" defaultValue={requiredQty} min="10" required className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white font-bold" />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">{t.deliveryAddress}</label>
                    <input type="text" name="delivery_address" defaultValue={currentUser.address || "Focal Point Phase-V, Jalandhar"} required className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div>
                    <label className="block text-slate-400 mb-1">{t.gstinNumber}</label>
                    <input type="text" name="gstin" defaultValue={currentUser.gstin || "03AAACA4582K1ZD"} required className="w-full bg-surface-subtle border border-surface-border rounded-xl px-3 py-2 text-white" />
                  </div>

                  <div className="p-3 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-[11px] text-emerald-300">
                    🔒 <b>Escrow Guarantee</b>: 20% advance locked immediately. 70% released upon dispatch weighment slip. 10% released upon arrival quality verification.
                  </div>

                  <div className="flex gap-3 pt-3">
                    <button type="button" onClick={() => setIsBuyModalOpen(false)} className="flex-1 py-2.5 bg-surface-subtle hover:bg-surface-accent border border-surface-border text-white rounded-xl">
                      {t.cancel}
                    </button>
                    <button type="submit" className="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-xl shadow-lg shadow-emerald-500/20">
                      Confirm & Lock Escrow
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 4. ACCOUNT / ROLE SWITCHER MODAL */}
          {isAccountModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-surface-card border border-surface-border rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-surface-border">
                  <h3 className="text-base font-bold text-white">{t.switchAccount}</h3>
                  <button onClick={() => setIsAccountModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-3">
                  <button
                    onClick={() => {
                      authenticateUser(DEMO_ACCOUNTS.buyer);
                      setIsAccountModalOpen(false);
                    }}
                    className={`w-full p-4 rounded-xl border text-left transition-all ${
                      currentUser.role === "BUYER" ? "bg-indigo-500/15 border-indigo-500 text-white" : "bg-surface-subtle border-surface-border text-slate-300 hover:border-slate-600"
                    }`}
                  >
                    <div className="text-xs font-mono font-bold text-indigo-400 uppercase">🏢 {t.buyerAccount}</div>
                    <div className="text-sm font-bold text-white mt-1">Aryan Foods & Flour Mills</div>
                    <div className="text-[11px] text-slate-400 font-mono">Jalandhar, Punjab • GSTIN Verified</div>
                  </button>

                  <button
                    onClick={() => {
                      authenticateUser(DEMO_ACCOUNTS.fpo);
                      setIsAccountModalOpen(false);
                    }}
                    className={`w-full p-4 rounded-xl border text-left transition-all ${
                      currentUser.role === "FPO" ? "bg-amber-500/15 border-amber-500 text-white" : "bg-surface-subtle border-surface-border text-slate-300 hover:border-slate-600"
                    }`}
                  >
                    <div className="text-xs font-mono font-bold text-amber-400 uppercase">🌾 {t.fpoAccount}</div>
                    <div className="text-sm font-bold text-white mt-1">Doaba Farmer Producer Co.</div>
                    <div className="text-[11px] text-slate-400 font-mono">Khanna Mandi, Punjab • Registered FPO</div>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TOAST NOTIFICATIONS */}
          <div className="fixed bottom-6 right-6 z-50 space-y-2 max-w-sm pointer-events-none">
            {toasts.map(toast => (
              <div
                key={toast.id}
                className={`p-4 rounded-2xl shadow-xl border text-xs font-mono font-semibold flex items-center gap-2 pointer-events-auto transition-all transform translate-y-0 ${
                  toast.type === "error"
                    ? "bg-red-950/90 text-red-200 border-red-800"
                    : "bg-surface-card/95 text-emerald-300 border-emerald-500/40"
                }`}
              >
                <span>{toast.type === "error" ? "❌" : "✓"}</span>
                <span>{toast.message}</span>
              </div>
            ))}
          </div>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
