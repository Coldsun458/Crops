<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AgriExchange | Market Arbitrage & Escrow Execution Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans pb-24 md:pb-10 selection:bg-emerald-500 selection:text-black min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [token, setToken] = useState(localStorage.getItem("agri_jwt") || "");
      const [accounts, setAccounts] = useState([]);
      const [tab, setTab] = useState("wholesale");
      const [notification, setNotification] = useState(null);

      const [commodity, setCommodity] = useState("Wheat");
      const [city, setCity] = useState("Jalandhar");
      const [quantityQtl, setQuantityQtl] = useState(100);
      const [baggingType, setBaggingType] = useState("50KG_JUTE_GUNNY");
      const [insuranceOpted, setInsuranceOpted] = useState(true);

      const [listings, setListings] = useState([]);
      const [bestPick, setBestPick] = useState(null);
      const [liveBids, setLiveBids] = useState([]);
      const [orders, setOrders] = useState([]);
      const [activeSlots, setActiveSlots] = useState([]);
      const [marketRegistry, setMarketRegistry] = useState(null);

      const [selectedLotForBuy, setSelectedLotForBuy] = useState(null);
      const [selectedLotForSample, setSelectedLotForSample] = useState(null);
      const [selectedLotForAssaying, setSelectedLotForAssaying] = useState(null);
      const [passbookData, setPassbookData] = useState(null);
      const [activePassbookLotId, setActivePassbookLotId] = useState("FPO-LOT-101");
      const [weighbridgeOriginModal, setWeighbridgeOriginModal] = useState(null);
      const [weighbridgeDestModal, setWeighbridgeDestModal] = useState(null);
      const [counterBidModal, setCounterBidModal] = useState(null);
      const [ewayModal, setEwayModal] = useState(null);
      const [mformModal, setMformModal] = useState(null);

      const [newBidForm, setNewBidForm] = useState({ commodity: "Wheat", target_qty_qtl: 200, target_bid_price_per_qtl: 2460, delivery_city: "Jalandhar" });
      const [counterForm, setCounterForm] = useState({ counter_price_per_qtl: 2510, counter_notes: "FPO certified lot ready for dispatch" });
      const [originWbForm, setOriginWbForm] = useState({ gross_weight_qtl: 142.5, tare_weight_qtl: 42.5 });
      const [destWbForm, setDestWbForm] = useState({ gross_weight_qtl: 142.1, tare_weight_qtl: 42.5, tested_moisture_pct: 12.0, tested_broken_pct: 1.6, tested_foreign_matter_pct: 0.4 });
      const [sampleAddress, setSampleAddress] = useState("Flour Mill Compound, GT Road, Jalandhar");
      const [buyAddress, setBuyAddress] = useState("Focal Point Phase-VIII, Jalandhar, Punjab - 144004");
      const [slotForm, setSlotForm] = useState({ truck_reg_number: "PB-10-XX-4412", mandi_hub: "Khanna, Punjab", commodity: "Wheat", quantity_qtl: 250, slot_date: "2026-09-08", window_key: "EARLY_MORNING" });

      const apiFetch = async (url, options = {}) => {
        const headers = { "Content-Type": "application/json", ...options.headers };
        if (token) headers["Authorization"] = `Bearer ${token}`;
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401 || res.status === 403) {
          const err = await res.json().catch(() => ({ detail: "Unauthorized" }));
          setNotification(`RBAC Alert: ${err.detail || 'Access Denied'}`);
          return null;
        }
        return res;
      };

      const loadAccounts = async () => {
        try {
          const res = await fetch("/api/v1/auth/accounts");
          const data = await res.json();
          setAccounts(data);
          if (!token && data.length > 0) loginAs(data[0].email);
          else if (token) {
            const meRes = await fetch("/api/v1/auth/me", { headers: { Authorization: `Bearer ${token}` } });
            if (meRes.ok) {
              const meData = await meRes.json();
              setCurrentUser(meData.user);
            } else if (data.length > 0) {
              loginAs(data[0].email);
            }
          }
        } catch (err) {
          console.error(err);
        }
      };

      const loginAs = async (email) => {
        try {
          const res = await fetch("/api/v1/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
          });
          const data = await res.json();
          if (data.token) {
            setToken(data.token);
            setCurrentUser(data.user);
            localStorage.setItem("agri_jwt", data.token);
            setNotification(`Logged in: ${data.user.name} (${data.user.role})`);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const fetchMarket = async () => {
        const res = await apiFetch("/api/v1/recommendations", {
          method: "POST",
          body: JSON.stringify({ commodity, buyer_city: city, quantity_qtl: Number(quantityQtl) })
        });
        if (res && res.ok) {
          const data = await res.json();
          setListings(data.all_listings || []);
          setBestPick(data.best_pick || null);
        }
      };

      const fetchBids = async () => {
        const res = await apiFetch("/api/v1/bids/live");
        if (res && res.ok) setLiveBids(await res.json());
      };

      const fetchOrders = async () => {
        const res = await apiFetch("/api/v1/orders/all");
        if (res && res.ok) setOrders(await res.json());
      };

      const fetchSlots = async () => {
        const res = await apiFetch("/api/v1/slots/active");
        if (res && res.ok) setActiveSlots(await res.json());
      };

      const fetchPassbook = async (lotId) => {
        const targetId = lotId || activePassbookLotId;
        const res = await apiFetch(`/api/v1/fpo/farmer-passbook/${targetId}`);
        if (res && res.ok) {
          const data = await res.json();
          setPassbookData(data);
          setActivePassbookLotId(targetId);
        }
      };

      useEffect(() => {
        loadAccounts();
      }, []);

      useEffect(() => {
        if (tab === "wholesale") fetchMarket();
        if (tab === "auction") fetchBids();
        if (tab === "orders") fetchOrders();
        if (tab === "fpo") fetchPassbook(activePassbookLotId);
        if (tab === "slots") fetchSlots();
      }, [tab, commodity, city, quantityQtl, token]);

      const handleConfirmBuy = async () => {
        if (!selectedLotForBuy) return;
        const res = await apiFetch("/api/v1/orders/buy", {
          method: "POST",
          body: JSON.stringify({
            lot_id: selectedLotForBuy.id,
            delivery_address: buyAddress,
            gstin: "03AAAAA0000A1Z5",
            payment_method: "ESCROW_UPI",
            quantity_qtl: Number(quantityQtl),
            bagging_type: baggingType,
            transit_insurance_opted: insuranceOpted
          })
        });
        if (res && res.ok) {
          const data = await res.json();
          setSelectedLotForBuy(null);
          setNotification(`Order Confirmed! e-Way Bill: ${data.order.eway_bill_no} | Stage 1 (20%) Escrow Locked!`);
          fetchMarket();
          fetchOrders();
          setTab("orders");
        }
      };

      const handleRequestSample = async () => {
        if (!selectedLotForSample) return;
        const res = await apiFetch("/api/v1/commercial/request-sample", {
          method: "POST",
          body: JSON.stringify({
            lot_id: selectedLotForSample.id,
            delivery_address: sampleAddress,
            buyer_phone: currentUser?.phone || "+91 98765-11223"
          })
        });
        if (res && res.ok) {
          const data = await res.json();
          setSelectedLotForSample(null);
          setNotification(`1kg Sample Dispatched! Tracking: ${data.sample.courier_tracking_no} via ${data.sample.courier_partner}`);
        }
      };

      const handleOriginWeighbridge = async (e) => {
        e.preventDefault();
        if (!weighbridgeOriginModal) return;
        const res = await apiFetch("/api/v1/commercial/weighbridge/origin-slip", {
          method: "POST",
          body: JSON.stringify({
            order_id: weighbridgeOriginModal.order_id,
            gross_weight_qtl: Number(originWbForm.gross_weight_qtl),
            tare_weight_qtl: Number(originWbForm.tare_weight_qtl)
          })
        });
        if (res && res.ok) {
          const data = await res.json();
          setWeighbridgeOriginModal(null);
          setNotification(data.message);
          fetchOrders();
        }
      };

      const handleDestinationCutter = async (e) => {
        e.preventDefault();
        if (!weighbridgeDestModal) return;
        const res = await apiFetch("/api/v1/commercial/weighbridge/destination-settle", {
          method: "POST",
          body: JSON.stringify({
            order_id: weighbridgeDestModal.order_id,
            gross_weight_qtl: Number(destWbForm.gross_weight_qtl),
            tare_weight_qtl: Number(destWbForm.tare_weight_qtl),
            tested_moisture_pct: Number(destWbForm.tested_moisture_pct),
            tested_broken_pct: Number(destWbForm.tested_broken_pct),
            tested_foreign_matter_pct: Number(destWbForm.tested_foreign_matter_pct)
          })
        });
        if (res && res.ok) {
          const data = await res.json();
          setWeighbridgeDestModal(null);
          setNotification(`Destination Audit Complete! Deductions: ₹${data.settlement_audit.total_cutter_deductions} | Net Released: ₹${data.settlement_audit.net_final_released_to_fpo}`);
          fetchOrders();
          fetchPassbook();
        }
      };

      const handleCreateBid = async (e) => {
        e.preventDefault();
        const res = await apiFetch("/api/v1/bids/create", {
          method: "POST",
          body: JSON.stringify(newBidForm)
        });
        if (res && res.ok) {
          const data = await res.json();
          setNotification(data.message);
          fetchBids();
        }
      };

      const handleAcceptBid = async (bidId) => {
        const res = await apiFetch(`/api/v1/bids/${bidId}/accept`, { method: "POST" });
        if (res && res.ok) {
          const data = await res.json();
          setNotification(data.message);
          fetchBids();
          fetchOrders();
        }
      };

      const handleCounterBid = async (e) => {
        e.preventDefault();
        if (!counterBidModal) return;
        const res = await apiFetch(`/api/v1/bids/${counterBidModal.bid_id}/counter`, {
          method: "POST",
          body: JSON.stringify({
            counter_price_per_qtl: Number(counterForm.counter_price_per_qtl),
            counter_notes: counterForm.counter_notes
          })
        });
        if (res && res.ok) {
          setCounterBidModal(null);
          setNotification(`Counter offer submitted at ₹${counterForm.counter_price_per_qtl}/qtl`);
          fetchBids();
        }
      };

      const handleAcceptCounter = async (bidId) => {
        const res = await apiFetch(`/api/v1/bids/${bidId}/counter-accept`, { method: "POST" });
        if (res && res.ok) {
          const data = await res.json();
          setNotification(data.message);
          fetchBids();
          fetchOrders();
          setTab("orders");
        }
      };

      const handleBookSlot = async (e) => {
        e.preventDefault();
        const res = await apiFetch("/api/v1/slots/book", {
          method: "POST",
          body: JSON.stringify(slotForm)
        });
        if (res && res.ok) {
          const data = await res.json();
          setNotification(`Mandi Slot Reserved: Token #${data.slot.token_number} (${data.slot.window_label})`);
          fetchSlots();
        }
      };

      const inspectMForm = async (hash) => {
        const res = await fetch(`/api/v1/compliance/mform/${hash}`);
        if (res.ok) setMformModal(await res.json());
      };

      const inspectEway = async (ewb) => {
        const res = await fetch(`/api/v1/compliance/eway-bill/${ewb}`);
        if (res.ok) setEwayModal(await res.json());
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-950">
          {/* Identity Simulation Header */}
          <div className="bg-slate-900 border-b border-slate-800/80 px-3 md:px-6 py-2 flex flex-wrap items-center justify-between text-xs gap-2 sticky top-0 z-40">
            <div className="flex items-center gap-2 overflow-x-auto py-1">
              <span className="text-slate-400 font-mono text-[11px] whitespace-nowrap">Switch Persona:</span>
              <div className="flex items-center gap-1.5">
                {accounts.map(acc => {
                  const isActive = currentUser?.email === acc.email;
                  return (
                    <button
                      key={acc.email}
                      onClick={() => loginAs(acc.email)}
                      className={`px-2.5 py-1 rounded-md text-[11px] font-mono font-medium transition whitespace-nowrap ${
                        isActive 
                          ? 'bg-emerald-500 text-slate-950 font-bold shadow-sm shadow-emerald-500/20' 
                          : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                      }`}>
                      {acc.role === "BUYER" && "🛒 "}
                      {acc.role === "FPO" && "🌾 "}
                      {acc.role === "MANDI_ADMIN" && "🏛️ "}
                      {acc.role === "TRANSPORTER" && "🚚 "}
                      {acc.name.split(" ")[0]} ({acc.role})
                    </button>
                  );
                })}
              </div>
            </div>

            {currentUser && (
              <div className="flex items-center gap-2 text-[11px] font-mono ml-auto">
                <span className="text-slate-400 hidden sm:inline">Active:</span>
                <span className="text-emerald-300 font-semibold">{currentUser.name}</span>
                <span className="px-1.5 py-0.5 rounded bg-emerald-950/80 border border-emerald-500/30 text-emerald-400 text-[10px]">
                  {currentUser.role}
                </span>
              </div>
            )}
          </div>

          {/* Top Brand & Desktop Navigation */}
          <header className="bg-slate-900/60 backdrop-blur-md border-b border-slate-800 px-4 md:px-8 py-3.5 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500/30 to-emerald-600/10 border border-emerald-500/40 flex items-center justify-center text-xl shadow-inner">
                🌾
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-white text-base tracking-tight">AGRI-EXCHANGE</span>
                  <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">Wholesaler Pro</span>
                </div>
                <p className="text-[11px] text-slate-400">Market Arbitrage, Safeguards & Escrow Terminal</p>
              </div>
            </div>

            {/* Desktop Navigation Tabs */}
            <nav className="hidden md:flex items-center bg-slate-900 p-1 rounded-xl border border-slate-800 gap-1 text-xs">
              <button 
                onClick={() => setTab("wholesale")}
                className={`px-3.5 py-2 rounded-lg font-semibold transition ${tab === 'wholesale' ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/10' : 'text-slate-400 hover:text-white'}`}>
                🛒 Wholesale Arbitrage
              </button>
              <button 
                onClick={() => setTab("auction")}
                className={`px-3.5 py-2 rounded-lg font-semibold transition ${tab === 'auction' ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/10' : 'text-slate-400 hover:text-white'}`}>
                ⚖️ Double Auction ({liveBids.length})
              </button>
              <button 
                onClick={() => setTab("orders")}
                className={`px-3.5 py-2 rounded-lg font-semibold transition ${tab === 'orders' ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/10' : 'text-slate-400 hover:text-white'}`}>
                📜 Orders & Escrow ({orders.length})
              </button>
              <button 
                onClick={() => setTab("fpo")}
                className={`px-3.5 py-2 rounded-lg font-semibold transition ${tab === 'fpo' ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/10' : 'text-slate-400 hover:text-white'}`}>
                👥 FPO Member Passbook
              </button>
              <button 
                onClick={() => setTab("slots")}
                className={`px-3.5 py-2 rounded-lg font-semibold transition ${tab === 'slots' ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/10' : 'text-slate-400 hover:text-white'}`}>
                🚚 Mandi Queue
              </button>
            </nav>
          </header>

          {/* Toast Notification */}
          {notification && (
            <div className="max-w-7xl mx-auto w-full px-4 md:px-8 mt-3">
              <div className="p-3 bg-emerald-950/90 border border-emerald-500/50 rounded-xl flex items-center justify-between text-xs text-emerald-200 shadow-lg shadow-emerald-950/30">
                <div className="flex items-center gap-2">
                  <span className="text-emerald-400 text-sm">⚡</span>
                  <span>{notification}</span>
                </div>
                <button onClick={() => setNotification(null)} className="text-emerald-400 hover:text-emerald-300 underline font-mono text-[11px] ml-4">
                  Dismiss
                </button>
              </div>
            </div>
          )}

          {/* Main Workspaces */}
          <main className="flex-1 max-w-7xl mx-auto w-full p-4 md:p-8 space-y-6">

            {/* TAB 1: WHOLESALE ARBITRAGE TERMINAL */}
            {tab === "wholesale" && (
              <div className="space-y-6">
                <div className="bg-slate-900/80 border border-slate-800 p-4 md:p-5 rounded-2xl shadow-xl space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div className="space-y-1.5">
                      <label className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">Commodity Select</label>
                      <div className="flex flex-wrap gap-2">
                        {["Wheat", "Rice", "Mustard"].map(c => (
                          <button
                            key={c}
                            onClick={() => setCommodity(c)}
                            className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${
                              commodity === c 
                                ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20' 
                                : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                            }`}>
                            <span>{c === "Wheat" ? "🌾" : c === "Rice" ? "🍚" : "🌼"}</span>
                            <span>{c}</span>
                            <span className="text-[10px] font-mono opacity-80">
                              (MSP ₹{c === "Wheat" ? "2,425" : c === "Rice" ? "2,320" : "5,650"})
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      <label className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">Destination City (Buyer Terminal)</label>
                      <div className="flex flex-wrap gap-1.5">
                        {["Jalandhar", "Delhi", "Chandigarh", "Jaipur", "Mumbai"].map(dst => (
                          <button
                            key={dst}
                            onClick={() => setCity(dst)}
                            className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                              city === dst 
                                ? 'bg-sky-500 text-slate-950 font-bold shadow-md shadow-sky-500/20' 
                                : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                            }`}>
                            📍 {dst}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-1.5">
                      <label className="text-[11px] font-mono text-slate-400 uppercase tracking-wider">Quantity (Quintals)</label>
                      <div className="flex items-center gap-2">
                        <input
                          type="number"
                          value={quantityQtl}
                          onChange={e => setQuantityQtl(Math.max(10, Number(e.target.value)))}
                          className="w-28 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white font-mono focus:border-emerald-500 focus:outline-none"
                        />
                        <span className="text-xs text-slate-400">qtl ({quantityQtl * 0.1} MT)</span>
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-4 text-xs">
                    <div className="flex items-center gap-2">
                      <span className="text-slate-400 font-mono text-[11px]">Packaging (Bardana):</span>
                      <select
                        value={baggingType}
                        onChange={e => setBaggingType(e.target.value)}
                        className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-slate-200 font-mono text-xs focus:border-emerald-500 focus:outline-none">
                        <option value="50KG_JUTE_GUNNY">50 kg New Jute Bags (B-Twill) [+₹65/qtl]</option>
                        <option value="50KG_PP_BAG">50 kg HDPE Woven PP Bags [+₹28/qtl]</option>
                        <option value="BULK_LOOSE_TIPPER">Loose Bulk Tipper Loading [+₹0/qtl]</option>
                      </select>
                    </div>

                    <div className="flex items-center gap-2">
                      <label className="flex items-center gap-2 cursor-pointer bg-slate-950/80 px-3 py-1 rounded-lg border border-slate-800">
                        <input
                          type="checkbox"
                          checked={insuranceOpted}
                          onChange={e => setInsuranceOpted(e.target.checked)}
                          className="rounded text-emerald-500 focus:ring-0 bg-slate-900 border-slate-700 w-4 h-4"
                        />
                        <span className="text-slate-300 text-xs">Transit Marine Cargo Insurance (0.08% Comprehensive)</span>
                      </label>
                    </div>
                  </div>
                </div>

                {/* SPOTLIGHT BEST BUY CARD */}
                {bestPick && (
                  <div className="bg-gradient-to-br from-slate-900 via-slate-900 to-emerald-950/40 border border-emerald-500/40 rounded-2xl p-5 md:p-6 shadow-2xl relative overflow-hidden">
                    <div className="flex flex-wrap items-start justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className="px-2.5 py-0.5 rounded-full bg-emerald-500 text-slate-950 text-[10px] font-extrabold uppercase tracking-wide">
                            ★ Recommended Arbitrage Optimal
                          </span>
                          <span className="text-xs font-mono text-slate-400">Score: {bestPick.recommendation_score}%</span>
                        </div>
                        <h2 className="text-xl md:text-2xl font-bold text-white tracking-tight">{bestPick.variety}</h2>
                        <p className="text-xs text-slate-400">

                    <div className="flex justify-between text-slate-300">
                      <span>Stage 2 (70% Dispatch): On Origin Weighbridge</span>
                      <span>₹{selectedLotForBuy.escrow_milestones?.dispatch_70?.toLocaleString()}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>Stage 3 (10% Final): Post-Destination Cutter Audit</span>
                      <span>₹{selectedLotForBuy.escrow_milestones?.final_10?.toLocaleString()}</span>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                  <button onClick={() => setSelectedLotForBuy(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">
                    Cancel
                  </button>
                  <button onClick={handleConfirmBuy} className="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs">
                    Confirm & Lock 20% Advance Escrow
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Sample Modal */}
          {selectedLotForSample && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white">Request Pre-Trade 1kg Sealed Sample</h3>
                    <p className="text-xs text-slate-400">{selectedLotForSample.variety}</p>
                  </div>
                  <button onClick={() => setSelectedLotForSample(null)} className="text-slate-400 hover:text-white font-mono text-lg">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1 font-mono">Courier Delivery Address</label>
                    <textarea
                      rows={2}
                      value={sampleAddress}
                      onChange={e => setSampleAddress(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono focus:border-emerald-500"
                    />
                  </div>

                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1 text-[11px] font-mono text-slate-300">
                    <div className="flex justify-between">
                      <span>Express Courier Partner:</span>
                      <strong className="text-white">DTDC Agri-Cold Express</strong>
                    </div>
                    <div className="flex justify-between">
                      <span>Parcel Integrity:</span>
                      <strong className="text-emerald-400">Tamper-Evident Sealed Pouch</strong>
                    </div>
                    <div className="flex justify-between">
                      <span>Sample Courier Fee:</span>
                      <strong className="text-white">₹450.00 (Flat)</strong>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                  <button onClick={() => setSelectedLotForSample(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">
                    Cancel
                  </button>
                  <button onClick={handleRequestSample} className="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs">
                    Dispatch Sample Parcel (₹450)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Origin Weighbridge Modal */}
          {weighbridgeOriginModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white">Origin Weighbridge Registration</h3>
                    <p className="text-xs text-slate-400">{weighbridgeOriginModal.order_id} • Unlocks 70% Escrow</p>
                  </div>
                  <button onClick={() => setWeighbridgeOriginModal(null)} className="text-slate-400 hover:text-white font-mono text-lg">✕</button>
                </div>

                <form onSubmit={handleOriginWeighbridge} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1 font-mono">Gross Weight (qtl with Truck)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={originWbForm.gross_weight_qtl}
                      onChange={e => setOriginWbForm({...originWbForm, gross_weight_qtl: Number(e.target.value)})}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white font-mono"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-mono">Tare Weight (Empty Truck qtl)</label>
                    <input
                      type="number"
                      step="0.1"
                      value={originWbForm.tare_weight_qtl}
                      onChange={e => setOriginWbForm({...originWbForm, tare_weight_qtl: Number(e.target.value)})}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white font-mono"
                    />
                  </div>

                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 font-mono text-slate-300">
                    Calculated Net Origin Weight: <strong className="text-emerald-400">{(originWbForm.gross_weight_qtl - originWbForm.tare_weight_qtl).toFixed(2)} qtl</strong>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setWeighbridgeOriginModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300">
                      Cancel
                    </button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold">
                      Confirm Dispatch & Release 70%
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Destination Weighbridge Modal */}
          {weighbridgeDestModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white">Destination Weighbridge & Cutter Audit</h3>
                    <p className="text-xs text-slate-400">{weighbridgeDestModal.order_id} • 0.3% Shrinkage & Moisture Deduction Matrix</p>
                  </div>
                  <button onClick={() => setWeighbridgeDestModal(null)} className="text-slate-400 hover:text-white font-mono text-lg">✕</button>
                </div>

                <form onSubmit={handleDestinationCutter} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-mono">Destination Gross (qtl)</label>
                      <input
                        type="number"
                        step="0.1"
                        value={destWbForm.gross_weight_qtl}
                        onChange={e => setDestWbForm({...destWbForm, gross_weight_qtl: Number(e.target.value)})}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1 font-mono">Destination Tare (qtl)</label>
                      <input
                        type="number"
                        step="0.1"
                        value={destWbForm.tare_weight_qtl}
                        onChange={e => setDestWbForm({...destWbForm, tare_weight_qtl: Number(e.target.value)})}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1 font-mono">Tested Moisture % (Base 11.5%)</label>
                      <input
                        type="number"
                        step="0.1"
                        value={destWbForm.tested_moisture_pct}
                        onChange={e => setDestWbForm({...destWbForm, tested_moisture_pct: Number(e.target.value)})}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono"
                      />
                      <span className="text-[10px] text-slate-500 font-mono">Penalty: ₹25/qtl per 0.5% over 11.5%</span>
                    </div>

                    <div>
                      <label className="text-slate-400 block mb-1 font-mono">Tested Broken % (Base 1.5%)</label>
                      <input
                        type="number"
                        step="0.1"
                        value={destWbForm.tested_broken_pct}
                        onChange={e => setDestWbForm({...destWbForm, tested_broken_pct: Number(e.target.value)})}
                        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setWeighbridgeDestModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300">
                      Cancel
                    </button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold">
                      Execute Cutter Deductions & Settle
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Counter Bid Modal */}
          {counterBidModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white">FPO Counter Offer Proposal</h3>
                    <p className="text-xs text-slate-400">Bid #{counterBidModal.bid_id} • Buyer offered ₹{counterBidModal.target_bid_price_per_qtl}/qtl</p>
                  </div>
                  <button onClick={() => setCounterBidModal(null)} className="text-slate-400 hover:text-white font-mono text-lg">✕</button>
                </div>

                <form onSubmit={handleCounterBid} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1 font-mono">Proposed Counter Price (₹/qtl)</label>
                    <input
                      type="number"
                      value={counterForm.counter_price_per_qtl}
                      onChange={e => setCounterForm({...counterForm, counter_price_per_qtl: Number(e.target.value)})}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white font-mono"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1 font-mono">Lot Specifications / Counter Note</label>
                    <textarea
                      rows={2}
                      value={counterForm.counter_notes}
                      onChange={e => setCounterForm({...counterForm, counter_notes: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setCounterBidModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300">
                      Cancel
                    </button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold">
                      Submit Counter Offer
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Assaying Modal */}
          {selectedLotForAssaying && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white">NABL Quality Assaying Certificate</h3>
                    <p className="text-xs text-slate-400">{selectedLotForAssaying.variety} • {selectedLotForAssaying.mandi}</p>
                  </div>
                  <button onClick={() => setSelectedLotForAssaying(null)} className="text-slate-400 hover:text-white font-mono text-lg">✕</button>
                </div>

                <div className="space-y-3 text-xs font-mono">
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1.5 text-slate-300">
                    <div className="flex justify-between">
                      <span className="text-slate-400">Accredited Laboratory:</span>
                      <span className="text-white font-semibold">{selectedLotForAssaying.assaying?.lab_name || 'Agmark Central Testing Lab'}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">NABL Certificate Serial:</span>
                      <span className="text-emerald-400">{selectedLotForAssaying.assaying?.nabl_cert_no || 'NABL-PB-7718-2026'}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Certified Grade:</span>
                      <span className="text-white font-bold">{selectedLotForAssaying.assaying?.grade || 'Super Premium Grade-A'}</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div className="p-2.5 bg-slate-950 rounded-lg border border-slate-800">
                      <span className="text-[10px] text-slate-400 block">Foreign Matter %</span>
                      <span className="font-bold text-white">{selectedLotForAssaying.assaying?.foreign_matter_pct}%</span>
                    </div>
                    <div className="p-2.5 bg-slate-950 rounded-lg border border-slate-800">
                      <span className="text-[10px] text-slate-400 block">Broken Grain %</span>
                      <span className="font-bold text-white">{selectedLotForAssaying.assaying?.broken_pct}%</span>
                    </div>
                    <div className="p-2.5 bg-slate-950 rounded-lg border border-slate-800">
                      <span className="text-[10px] text-slate-400 block">Protein / Gluten %</span>
                      <span className="font-bold text-emerald-400">{selectedLotForAssaying.assaying?.protein_pct}%</span>
                    </div>
                    <div className="p-2.5 bg-slate-950 rounded-lg border border-slate-800">
                      <span className="text-[10px] text-slate-400 block">Grain Kernel Length</span>
                      <span className="font-bold text-sky-400">{selectedLotForAssaying.assaying?.grain_length_mm} mm</span>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end pt-2 border-t border-slate-800">
                  <button onClick={() => setSelectedLotForAssaying(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">
                    Close Assaying Report
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* M-Form Modal */}
          {mformModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🛡️</span>
                    <div>
                      <h3 className="text-base font-bold text-white">APMC M-Form Compliance</h3>
                      <p className="text-xs text-slate-400">Highway Transit Exemption Certificate</p>
                    </div>
                  </div>
                  <button onClick={() => setMformModal(null)} className="text-slate-400 hover:text-white font-mono text-lg">✕</button>
                </div>

                <div className="space-y-2.5 text-xs font-mono">
                  <div className="p-3 bg-emerald-950/40 border border-emerald-500/40 rounded-xl space-y-1.5 text-emerald-200">
                    <div className="flex justify-between font-bold">
                      <span>Verification Status:</span>
                      <span>{mformModal.status}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>Issuing Board:</span>
                      <span>{mformModal.issuing_board}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>Origin Mandi:</span>
                      <span>{mformModal.origin_apmc_mandi}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>Mandi Fee Paid at Source:</span>
                      <span className="text-emerald-300 font-bold">{mformModal.mandi_fee_verified_rate}</span>
                    </div>
                    <div className="flex justify-between text-slate-300">
                      <span>RDF Paid at Source:</span>
                      <span className="text-emerald-300 font-bold">{mformModal.rdf_verified_rate}</span>
                    </div>
                  </div>

                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1 text-slate-400">
                    <div>Enforcement Squad Directive:</div>
                    <div className="text-emerald-400 font-bold">{mformModal.enforcement_clearance}</div>
                    <div className="text-[10px] text-slate-500 truncate mt-1">Hash: {mformModal.mform_document_hash}</div>
                  </div>
                </div>

                <div className="flex justify-end pt-2 border-t border-slate-800">
                  <button onClick={() => setMformModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">
                    Close Certificate
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* e-Way Bill Modal */}
          {ewayModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-white">e-Way Bill Regulatory Pass</h3>
                    <p className="text-xs text-slate-400">National E-Way Bill System Verification</p>
                  </div>
                  <button onClick={() => setEwayModal(null)} className="text-slate-400 hover:text-white font-mono text-lg">✕</button>
                </div>

                <div className="space-y-2.5 text-xs font-mono">
                  <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1.5 text-slate-300">
                    <div className="flex justify-between font-bold text-sky-400 text-sm">
                      <span>e-Way Bill No:</span>
                      <span>{ewayModal.eway_bill_no}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">HSN Code:</span>
                      <span className="text-white">{ewayModal.hsn_code} (Grain / Cereals)</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Vehicle Number:</span>
                      <span className="text-white font-bold">{ewayModal.vehicle_number}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Supplier GSTIN:</span>
                      <span className="text-slate-300">{ewayModal.supplier_gstin}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Recipient GSTIN:</span>
                      <span className="text-slate-300">{ewayModal.buyer_gstin}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Valid Until:</span>
                      <span className="text-emerald-400">{ewayModal.valid_until?.split('T')[0]} (72h Window)</span>
                    </div>
                  </div>
                </div>

                <div className="flex justify-end pt-2 border-t border-slate-800">
                  <button onClick={() => setEwayModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs">
                    Close Pass
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
